# MEVana Critical Alerting Rules
# Monitors essential system health and trading performance

groups:
  - name: mevana_system_health
    folder: MEVana
    interval: 30s
    rules:
      - alert: MEVanaServiceDown
        uid: mevana-service-down
        title: "MEVana service down"
        expr: up{job=~"system-orchestrator|discovery-service|arb-engine"} == 0
        for: 1m
        labels:
          severity: critical
          service: "{{ $labels.job }}"
        annotations:
          summary: "MEVana service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} at {{ $labels.instance }} has been down for more than 1 minute"
          
      - alert: MEVanaUnhealthyServices
        uid: mevana-unhealthy-services
        title: "Multiple services unhealthy"
        expr: mevana_services_unhealthy > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Multiple MEVana services unhealthy"
          description: "{{ $value }} services are currently unhealthy"

  - name: mevana_arbitrage_performance  
    folder: MEVana
    interval: 15s
    rules:
      - alert: LowArbitrageSuccessRate
        uid: mevana-low-success-rate
        title: "Low arbitrage success rate"
        expr: arb_execution_success_rate < 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low arbitrage execution success rate"
          description: "Arbitrage success rate is {{ $value }}%, below 50% threshold"
          
      - alert: ArbitrageOpportunitiesStalled
        uid: mevana-opportunities-stalled
        title: "Arbitrage opportunities stalled"
        expr: rate(arb_opportunities_detected_total[5m]) == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "No arbitrage opportunities detected"
          description: "No new arbitrage opportunities detected in the last 3 minutes"

  - name: mevana_infrastructure
    folder: MEVana
    interval: 60s
    rules:
      - alert: PrometheusTargetDown
        uid: mevana-prometheus-down
        title: "Prometheus target down"
        expr: up{job="prometheus"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus monitoring is down"
          description: "Prometheus instance is unreachable"
          
      - alert: HighTokenEnrichmentLatency
        uid: mevana-token-latency-high
        title: "High token enrichment latency"
        expr: histogram_quantile(0.95, rate(token_enrich_latency_seconds_bucket[5m])) > 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High token enrichment latency"
          description: "95th percentile latency is {{ $value }}s, above 2s threshold"

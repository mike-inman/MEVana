apiVersion: 1
contactPoints:
  - orgId: 1
    name: slack-primary
    receivers:
      - uid: slack
        type: slack
        settings:
          url: ${SLACK_WEBHOOK_URL}
          recipient: "#mevana-alerts"
          mentionChannel: "here"
          title: "{{ .Status | toUpper }}: {{ .Alerts | len }} active alerts"
          text: |
            {{ range .Alerts -}}
            *Alert*: {{ .Labels.alertname }} ({{ .Labels.severity }})
            {{ .Annotations.summary }}
            {{ .Annotations.description }}
            ---
            {{ end }}
        disableResolveMessage: false

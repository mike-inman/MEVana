apiVersion: 1
groups:
  - name: test-alerts
    orgId: 1
    folder: MEVana Alerts
    interval: 1m
    rules:
      - uid: test-slack-integration
        title: Test Slack Alert
        condition: A
        data:
          - refId: A
            queryType: ""
            model:
              expr: "vector(1)"
              refId: A
              datasourceUid: prometheus
        for: 30s
        annotations:
          summary: "Test alert to verify Slack integration is working"
          description: "This is a test alert that always fires to verify Slack notifications are working correctly."
        labels:
          severity: warning
          team: devops
apiVersion: 1
policies:
  - orgId: 1
    receiver: slack-primary
    group_by: ["alertname"]
    group_wait: 30s
    group_interval: 2m
    repeat_interval: 4h
    routes:
      - receiver: slack-primary
        matchers:
          - severity = critical
      - receiver: slack-primary
        matchers:
          - severity = warning

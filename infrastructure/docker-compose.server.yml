# Server deployment stack (Vultr) – standard ports
# - Uses external network 'mevana_net'
# - Publishes standard host ports matching local docs

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper-service
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    healthcheck:
      test: ["CMD", "bash", "-c", "echo stat | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Expose only if you need to debug externally; otherwise keep internal
    ports:
      - "2181:2181"
    networks: [mevana_net]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka-service
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper-service:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-service:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Publish external 29092 if you'll access Kafka from outside the host
    ports:
      - "9092:9092"
      - "29092:29092"
    networks: [mevana_net]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka-service:9092
      - KAFKA_CLUSTERS_0_READONLY=false
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=prometheus,health,info
      - MANAGEMENT_METRICS_EXPORT_PROMETHEUS_ENABLED=true
      - MANAGEMENT_SERVER_PORT=8080
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8080:8080"
    networks: [mevana_net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis-service
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6379:6379"
    networks: [mevana_net]
    restart: unless-stopped

  postgres:
    image: postgres:15
    container_name: postgres-service
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mev}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mevpassword}
      - POSTGRES_DB=${POSTGRES_DB:-mevdb}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mev} -d ${POSTGRES_DB:-mevdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks: [mevana_net]
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: adminer-service
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8082:8080"
    networks: [mevana_net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-service
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.core.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "9090:9090"
    networks: [mevana_net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-service
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "3000:3000"
    networks: [mevana_net]
    restart: unless-stopped

  hotpath-arb-engine:
    image: ghcr.io/mike-inman/mevana-hotpath-arb-engine:${MEVANA_TAG:-dev}
    container_name: mevana-hotpath
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - METRICS_PORT=8088
      - KAFKA_BROKER=kafka-service:9092
      - REDIS_URL=redis://redis-service:6379/0
      - DATABASE_URL=postgresql://mev:mevpassword@postgres-service:5432/mevdb
      - GEYSER_ENDPOINT=${ENDPOINT:-https://grpc.ny.shyft.to}
      - X_TOKEN=${X_TOKEN}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [mevana_net]
    restart: unless-stopped

  # Add missing services that were running on server
  normalizer-service:
    image: ghcr.io/mike-inman/mevana-normalizer-service:${MEVANA_TAG:-dev}
    container_name: mevana-normalizer
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - METRICS_PORT=8085
      - KAFKA_BROKER=kafka-service:9092
      - DATABASE_URL=postgresql://mev:mevpassword@postgres-service:5432/mevdb
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [mevana_net]
    restart: unless-stopped

  discovery-service:
    image: ghcr.io/mike-inman/mevana-discovery-service:${MEVANA_TAG:-dev}
    container_name: mevana-discovery
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - DISCOVERY_METRICS_PORT=9102
      - KAFKA_BROKER=kafka-service:9092
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [mevana_net]
    restart: unless-stopped

  executor-service:
    image: ghcr.io/mike-inman/mevana-executor-service:${MEVANA_TAG:-dev}
    container_name: mevana-executor
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - KAFKA_BROKER=kafka-service:9092
      - DATABASE_URL=postgresql://mev:mevpassword@postgres-service:5432/mevdb
    networks: [mevana_net]
    restart: unless-stopped

networks:
  mevana_net:
    external: true
    name: mevana_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

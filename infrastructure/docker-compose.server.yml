# Server deployment stack — uses the same service definitions as the local core
# compose file so production mirrors local development. Any overrides that are
# truly server-specific should be added here on top of the shared configuration.

services:
  zookeeper:
    extends:
      file: docker-compose.core.yml
      service: zookeeper

  kafka:
    extends:
      file: docker-compose.core.yml
      service: kafka

  kafka-ui:
    extends:
      file: docker-compose.core.yml
      service: kafka-ui

  redis:
    extends:
      file: docker-compose.core.yml
      service: redis
    ports: []

  redis-ui:
    extends:
      file: docker-compose.core.yml
      service: redis-ui

  postgres:
    extends:
      file: docker-compose.core.yml
      service: postgres

  adminer:
    extends:
      file: docker-compose.core.yml
      service: adminer

  prometheus:
    extends:
      file: docker-compose.core.yml
      service: prometheus
    volumes:
      - ./prometheus.prod.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerting-rules.yml:/etc/prometheus/alerting-rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    extends:
      file: docker-compose.core.yml
      service: grafana
    env_file:
      - /etc/mevana/alerts.env
    environment:
      GF_SECURITY_DISABLE_SANITIZE_HTML: "true"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/dashboards/curated:/etc/grafana/provisioning/dashboards/mevana
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro

networks:
  mevana_net:
    external: true
    name: mevana_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:
  kafka_data:

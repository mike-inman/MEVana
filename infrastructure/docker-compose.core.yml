# Clean core stack for MEVana (infra + hotpath)
# Uses a single external network: mevana_net

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_AUTOPURGE_SNAP_RETAIN_COUNT: 3
      ZOOKEEPER_AUTOPURGE_PURGE_INTERVAL: 24
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    healthcheck:
      test: ["CMD", "bash", "-c", "echo stat | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port mapping needed; used internally by Kafka
    networks: [mevana_net]
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - "29092:29092"   # expose Kafka externally for native services
    networks: [mevana_net]
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_READONLY=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8084:8080"   # moved to 8084 on host to avoid conflicts
    networks: [mevana_net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "6380:6379"   # avoid host conflict on 6379; use 6380 on host
    networks: [mevana_net]
    restart: unless-stopped

  redis-ui:
    image: redislabs/redisinsight:latest
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - RIPROXYENABLE=false
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "8083:8001"
    networks: [mevana_net]
    restart: unless-stopped

  postgres:
    image: postgres:15
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-mev}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-mevpassword}
      - POSTGRES_DB=${POSTGRES_DB:-mevdb}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8 --lc-collate=C --lc-ctype=C
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mev} -d ${POSTGRES_DB:-mevdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5433:5432"   # expose postgres externally for native services
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks: [mevana_net]
    restart: unless-stopped

  adminer:
    image: adminer
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "8087:8080"   # moved to 8087 on host to avoid conflicts
    networks: [mevana_net]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.core.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    ports:
      - "9091:9090"   # host maps to 9091 to avoid conflicts
    networks: [mevana_net]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.5
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=grafana-metricsdrilldown-app,grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app
      - GF_LOG_LEVEL=info
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards/curated:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "${GRAFANA_HOST_PORT:-3001}:3000"   # host maps to overridable port (default 3001)
    networks: [mevana_net]
    restart: unless-stopped

  hotpath-arb-engine:
    build:
      context: ..
      dockerfile: crates/hotpath_arb_engine/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - METRICS_PORT=${HOTPATH_INTERNAL_METRICS_PORT:-8088}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql://mev:mevpassword@postgres:5432/mevdb}
      - GEYSER_ENDPOINT=${GEYSER_ENDPOINT:-https://grpc.ny.shyft.to}
      - X_TOKEN=${X_TOKEN:-}
      - FLASH_LOAN_PROVIDERS_CONFIG=${FLASH_LOAN_PROVIDERS_CONFIG:-/app/config/flash_loan_providers.local.json}
    ports:
      - "${HOTPATH_METRICS_PORT:-8088}:8088"
      - "${HOTPATH_API_PORT:-8089}:8089"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8089/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks: [mevana_net]
    volumes:
      - ../config:/app/config:ro
    restart: unless-stopped

  normalizer-service:
    build:
      context: ..
      dockerfile: crates/normalizer-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - IN_TOPIC=${NORMALIZER_IN_TOPIC:-dex-transactions}
      - OUT_TOPIC=${NORMALIZER_OUT_TOPIC:-orca-swaps.parsed.v2}
      - GROUP_ID=${NORMALIZER_GROUP_ID:-tap-orca-extract}
      - HEALTH_PORT=${NORMALIZER_HEALTH_PORT:-8085}
      - BIND_ADDRESS=${NORMALIZER_BIND_ADDRESS:-0.0.0.0}
      - METRICS_PORT=${NORMALIZER_METRICS_PORT_INTERNAL:-8085}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "9901:8085"
    networks: [mevana_net]
    restart: unless-stopped

  discovery-service:
    build:
      context: ..
      dockerfile: crates/discovery-service/Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - DISCOVERY_METRICS_PORT=${DISCOVERY_METRICS_PORT_INTERNAL:-9102}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "9102:9102"
    networks: [mevana_net]
    restart: unless-stopped

  executor-service:
    build:
      context: ..
      dockerfile: crates/executor-service/executor-service.Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      - RUST_LOG=${RUST_LOG:-info}
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
      - DATABASE_URL=${DATABASE_URL:-postgresql://mev:mevpassword@postgres:5432/mevdb}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - METRICS_PORT=${EXECUTOR_METRICS_PORT_INTERNAL:-9904}
      - EXECUTION_DRY_RUN=${EXECUTION_DRY_RUN:-true}
      - SHYFT_API_KEY=${SHYFT_API_KEY:-}
      - ALLOW_EMPTY_SHYFT_API=${ALLOW_EMPTY_SHYFT_API:-1}
      - WALLET_KEYPAIR_PATH=${WALLET_KEYPAIR_PATH:-/root/.config/solana/id.json}
      - FLASH_LOAN_PROVIDERS_CONFIG=${FLASH_LOAN_PROVIDERS_CONFIG:-/app/config/flash_loan_providers.local.json}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9904/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "9904:9904"
    volumes:
      - ./keys:/root/.config/solana:ro
      - ../config:/app/config:ro
    networks: [mevana_net]
    restart: unless-stopped

networks:
  mevana_net:
    external: true
    name: mevana_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:

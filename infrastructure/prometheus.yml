global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # =============================================================================
  # INFRASTRUCTURE SERVICES (Docker Internal)
  # =============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # =============================================================================
  # MEVANA SERVICES (internal Docker network)
  # =============================================================================

  - job_name: 'hotpath-arb-engine'
    static_configs:
      - targets: ['host.docker.internal:8099']
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
    fallback_scrape_protocol: 'PrometheusText0.0.4'

  - job_name: 'normalizer-service'
    static_configs:
      - targets: ['normalizer-service:8085']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'discovery-service'
    static_configs:
      - targets: ['discovery-service:9102']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: 'executor-service'
    static_configs:
      - targets: ['executor-service:9904']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'edge-assembler'
    static_configs:
      - targets: ['edge-assembler:9902']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: 'arb-engine'
    static_configs:
      - targets: ['arb-engine:8085']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'monitoring-service'
    static_configs:
      - targets: ['monitoring-service:8091']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # =============================================================================
  # EXTERNAL SOLANA DATA (Learning Example)
  # =============================================================================

  - job_name: 'laserstream-metrics'
    static_configs:
      - targets: ['host.docker.internal:9100']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'solana-exporter'
    static_configs:
      - targets: ['host.docker.internal:9101']
    metrics_path: '/metrics'
    scrape_interval: 30s
    scrape_timeout: 15s
    honor_labels: true
    fallback_scrape_protocol: 'PrometheusText0.0.4'

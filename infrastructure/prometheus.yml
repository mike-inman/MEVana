global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # =============================================================================
  # MEVANA SERVICES MONITORING
  # =============================================================================
  
  - job_name: 'mevana-services'
    static_configs:
      - targets: 
        - 'dex-stream-universal:8080'
        - 'dex-backfill:8080'
        - 'shyft-validator:8080'
        - 'arb-test-mode:8080'
        - 'depth-builder:8080'
        - 'ui-gateway:8080'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  - job_name: 'mevana-testing'
    static_configs:
      - targets: ['localhost:9091']  # Use localhost for host services
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # =============================================================================
  # PERFORMANCE MONITORING
  # =============================================================================
  
  - job_name: 'mevana-performance'
    static_configs:
      - targets: ['localhost:9092']  # Use localhost for host services
    metrics_path: '/metrics'
    scrape_interval: 1s  # High frequency for performance monitoring
    scrape_timeout: 1s 

  # =============================================================================
  # ARB ENGINE (HOST) - scrape directly from host process (cargo run) via Docker -> host bridge
  # NOTE: On macOS Docker Desktop, 'host.docker.internal' resolves to the host.
  # If you later containerize arb-engine, replace with 'arb-engine:8080'.
  # =============================================================================
  - job_name: 'arb-engine'
    static_configs:
      - targets:
        - 'host.docker.internal:8180'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  # =============================================================================
  # MULTI-GEYSER-STREAMS (HOST) - scrape directly from host process (systemd service) via Docker -> host bridge
  # =============================================================================
  - job_name: 'multi-geyser-streams'
    static_configs:
      - targets:
        - 'host.docker.internal:8086'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
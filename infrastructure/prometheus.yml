global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # =============================================================================
  # INFRASTRUCTURE SERVICES (Docker Internal)
  # =============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # =============================================================================
  # MEVANA SERVICES (Host via Docker Bridge)
  # =============================================================================
  
  - job_name: 'system-orchestrator'
    static_configs:
      - targets:
          - 'host.docker.internal:9999'  # system-orchestrator
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: 'discovery-service'
    static_configs:
      - targets:
          - 'host.docker.internal:9102'  # discovery-service
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

  - job_name: 'pipeline-services'
    static_configs:
      - targets:
          - 'host.docker.internal:9901'  # normalizer-service
          - 'host.docker.internal:9902'  # edge-assembler
          - 'host.docker.internal:9904'  # executor-service
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # =============================================================================
  # TRADING SERVICES (when available)
  # =============================================================================
  
  - job_name: 'hotpath-arb-engine'
    static_configs:
      - targets:
          - 'host.docker.internal:8088'  # Single Geyser stream
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  - job_name: 'arb-engine'
    static_configs:
      - targets:
          - 'host.docker.internal:8085'  # arb-engine API (when ready)
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  - job_name: 'monitoring-service'
    static_configs:
      - targets:
          - 'host.docker.internal:8091'  # monitoring-service (when ready)
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
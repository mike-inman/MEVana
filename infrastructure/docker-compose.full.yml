# Application services overlay for production deployments.
# Definitions are intentionally kept in sync with infrastructure/docker-compose.core.yml
# so container names, health checks, and exposed ports match local development.

services: {}
# hotpath-arb-engine (disabled) previously ran the hotpath service in Docker; binaries now run under systemd
# normalizer-service (disabled) previously ran the normalizer in Docker; binaries now run under systemd
# discovery-service (disabled) previously ran the discovery service in Docker; binaries now run under systemd
# executor-service (disabled) previously ran the executor in Docker; binaries now run under systemd

networks:
  mevana_net:
    external: true
    name: mevana_net

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  redis_data:

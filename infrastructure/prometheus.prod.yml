global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # =============================================================================
  # INFRASTRUCTURE SERVICES (Docker Internal)
  # =============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # =============================================================================
  # MEVANA SERVICES (Production - Host bridge)
  # NOTE: We rely on host.docker.internal (mapped via extra_hosts) so Prometheus can
  #       scrape services regardless of container name. Ensure each service binds
  #       its metrics port on the host when running outside compose.
  # =============================================================================

  - job_name: 'hotpath-engine'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets:
          - 'host.docker.internal:8088'

  - job_name: 'normalizer-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:8085'

  - job_name: 'discovery-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:9102'

  - job_name: 'executor-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:9904'

  - job_name: 'arb-engine'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:8085'

  - job_name: 'monitoring-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets:
          - 'host.docker.internal:8091'

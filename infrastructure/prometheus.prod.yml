global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/rules/*.yml"

scrape_configs:
  # =============================================================================
  # INFRASTRUCTURE SERVICES (Docker Internal)
  # =============================================================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # =============================================================================
  # MEVANA SERVICES (Docker internal targets to match local compose)
  # =============================================================================

  - job_name: 'hotpath-arb-engine'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: ['hotpath-arb-engine:8088']

  - job_name: 'discovery-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['discovery-service:9102']

  - job_name: 'executor-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['executor-service:9904']

  - job_name: 'normalizer-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['normalizer-service:8085']

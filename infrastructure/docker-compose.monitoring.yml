version: '3.8'

services:
  monitoring-service:
    build:
      context: .
      dockerfile: monitoring.Dockerfile
    ports:
      - "8090:8090"
    environment:
      - MONITORING_PORT=8090
      - DATABASE_URL=postgresql://mev:<POSTGRES_PASSWORD>@postgres:5432/mevdb
      - RUST_LOG=info
    depends_on:
      - postgres
      - redis
    networks:
      - mevana_network
    restart: unless-stopped

  # Add a metrics endpoint for Grafana that proxies to monitoring service
  metrics-proxy:
    image: nginx:alpine
    ports:
      - "8089:80"
    volumes:
      - ./monitoring-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - monitoring-service
    networks:
      - mevana_network
    restart: unless-stopped

networks:
  mevana_network:
    external: true
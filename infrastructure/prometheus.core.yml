global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'kafka-ui'
    static_configs:
      - targets: ['kafka-ui:8080']

  # Hotpath engine metrics (internal scrape)
  - job_name: 'hotpath-arb-engine'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: ['hotpath-arb-engine:8088']


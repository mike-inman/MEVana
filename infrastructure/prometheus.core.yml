global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Infrastructure Services
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # MEVana Services - Running on host
  - job_name: 'hotpath-arb-engine'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: ['hotpath-arb-engine:8088']

  - job_name: 'discovery-service'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['discovery-service:9102']

  - job_name: 'executor-service'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['executor-service:9904']

  # Additional service scrape configs can be appended here as new components are containerized

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Infrastructure Services
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  - job_name: 'kafka-ui'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['kafka-ui:8080']

  # MEVana Services - Running on host
  - job_name: 'mevana-hotpath'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s
    static_configs:
      - targets: ['host.docker.internal:8088']

  - job_name: 'mevana-normalizer'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:8085']

  - job_name: 'mevana-discovery'
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s
    static_configs:
      - targets: ['host.docker.internal:9102']
events {
    worker_connections 1024;
}

http {
    upstream monitoring {
        server monitoring-service:8090;
    }

    server {
        listen 80;
        
        # Prometheus-compatible metrics endpoint
        location /metrics {
            # Convert monitoring API to Prometheus format
            proxy_pass http://monitoring/api/metrics/prometheus;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        
        # API endpoints for MEVana UI
        location /api/ {
            proxy_pass http://monitoring/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }
        
        # Health check
        location /health {
            proxy_pass http://monitoring/health;
        }
    }
}
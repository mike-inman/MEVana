global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']

  # =============================================================================
  # MEVANA SMART FILTER MONITORING - NEW: Working monitoring service
  # =============================================================================
  
  - job_name: 'mevana-monitoring'
    static_configs:
      - targets: ['localhost:8090']  # Our working monitoring service
    metrics_path: '/health'  # Use health endpoint for now
    scrape_interval: 5s
    scrape_timeout: 3s

  # =============================================================================
  # HOTPATH ARB ENGINE - Smart Filter Integration
  # =============================================================================
  
  - job_name: 'hotpath-engine'
    static_configs:
      - targets: ['localhost:8088']  # Hotpath engine with smart filter
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 10s  # Longer timeout since this endpoint is slow

  # =============================================================================
  # MEVANA SERVICES MONITORING  
  # =============================================================================
  
  - job_name: 'mevana-services'
    static_configs:
      - targets: 
        - 'dex-stream-universal:8080'
        - 'dex-backfill:8080'
        - 'shyft-validator:8080'
        - 'arb-test-mode:8080'
        - 'depth-builder:8080'
        - 'ui-gateway:8080'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  - job_name: 'mevana-testing'
    static_configs:
      - targets: ['localhost:9091']  # Use localhost for host services
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # =============================================================================
  # PERFORMANCE MONITORING
  # =============================================================================
  
  - job_name: 'mevana-performance'
    static_configs:
      - targets: ['localhost:9092']  # Use localhost for host services
    metrics_path: '/metrics'
    scrape_interval: 1s  # High frequency for performance monitoring
    scrape_timeout: 1s 

  # =============================================================================
  # ARB ENGINE (HOST) - scrape directly from host process with host networking
  # FIXED: Using host networking for reliable host service access
  # =============================================================================
  - job_name: 'arb-engine'
    static_configs:
      - targets:
        - 'localhost:8085'
    metrics_path: '/metrics'
    scrape_interval: 5s
    scrape_timeout: 3s

  # =============================================================================
  # WHIRLPOOL LIVE STREAM - real-time data ingestion metrics
  # =============================================================================
  - job_name: 'whirlpool-stream'
    static_configs:
      - targets:
        - 'localhost:8086'
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s
# =============================================================================
# SOLANA AI TRADING PLATFORM - ENHANCED DOCKER COMPOSE
# =============================================================================
# Enhanced version with improved connectivity, monitoring, and resource management

services:
  # =============================================================================
  # INFRASTRUCTURE SERVICES
  # =============================================================================
  
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      ZOOKEEPER_MAX_CLIENT_CNXNS: 60
      ZOOKEEPER_SYNC_LIMIT: 2
      ZOOKEEPER_INIT_LIMIT: 5
    healthcheck:
      test: ["CMD", "bash", "-c", "echo stat | nc localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "2181:2181"
    networks:
      - mevana-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_HEAP_OPTS: "-Xmx1G -Xms1G"
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_DELETE_TOPIC_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: false
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  dex-stream-universal:
    build:
      context: ../..
      dockerfile: crates/dex-stream-universal/Dockerfile
    image: dex-stream-universal:latest
    container_name: dex-stream-universal
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      - KAFKA_BROKER=kafka:9092
      - ENDPOINT=${SHYFT_GRPC_ENDPOINT}
      - X_TOKEN=${SHYFT_GRPC_TOKEN}
      - PROGRAM_IDS=${PROGRAM_IDS:-whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc,5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1,cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG}
      - RUST_LOG=${RUST_LOG:-info}
    command: ["--topic","geyser.raw"]
    networks:
      - mevana-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru --save 900 1 --save 300 10 --save 60 10000
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  redis-ui:
    image: rediscommander/redis-commander:latest
    container_name: redis-ui
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin123
    ports:
      - "8083:8081"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # =============================================================================
  # STREAMING SERVICES
  # =============================================================================

  stream-orca:
    build:
      context: ..
      dockerfile: stream-orca/Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: arbitrage-stream-orca:latest
    container_name: stream-orca
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - SHYFT_GRPC_ENDPOINT=${SHYFT_GRPC_ENDPOINT}
      - SHYFT_GRPC_TOKEN=${SHYFT_GRPC_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - METRICS_PORT=9090
      - IDL_PATH=/app
      - RUST_LOG=${RUST_LOG:-info}
      - HEARTBEAT_INTERVAL=30
      - CONNECTION_TIMEOUT=30
      - RECONNECT_DELAY=5
      - ENABLE_TIMER=${ENABLE_TIMER:-false}
      - TIMER_DURATION_SECONDS=${TIMER_DURATION_SECONDS:-20}
      - PROGRAM_IDS=${PROGRAM_IDS:-whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc}
    ports:
      - "9094:9090"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "stream-orca"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  stream-raydium:
    build:
      context: ../stream-raydium
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: arbitrage-stream-raydium:latest
    container_name: stream-raydium
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - SHYFT_GRPC_ENDPOINT=${SHYFT_GRPC_ENDPOINT}
      - SHYFT_GRPC_TOKEN=${SHYFT_GRPC_TOKEN}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - METRICS_PORT=9090
      - IDL_PATH=/app
      - RUST_LOG=${RUST_LOG:-info}
      - HEARTBEAT_INTERVAL=30
      - CONNECTION_TIMEOUT=30
      - RECONNECT_DELAY=5
    ports:
      - "9093:9090"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "stream-raydium"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # =============================================================================
  # PROCESSING SERVICES
  # =============================================================================

  swap-ingest:
    build:
      context: ../Arbitrage/solana-arbitrage/swap-ingest
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: arbitrage-swap-ingest:latest
    container_name: swap-ingest
    depends_on:
      redis:
        condition: service_healthy
      stream-orca:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MIN_PROFIT_THRESHOLD=${MIN_PROFIT_THRESHOLD:-1.001}
      - METRICS_PORT=9090
      - RUST_LOG=${RUST_LOG:-info}
      - HEARTBEAT_INTERVAL=30
      - BATCH_SIZE=50
      - PROCESSING_TIMEOUT=30
    ports:
      - "9094:9090"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "swap-ingest"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  data-stream-processor:
    build:
      context: ../data-stream-processor
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: data-stream-processor:latest
    container_name: data-stream-processor
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - PROCESSING_INTERVAL=5
      - RUST_LOG=${RUST_LOG:-info}
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep data-stream-processor | grep -v grep || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 128M
          cpus: '0.1'

  pathfinder:
    build:
      context: ../Arbitrage/solana-arbitrage/pathfinder
      dockerfile: Dockerfile
      target: runtime
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: arbitrage-pathfinder:latest
    container_name: pathfinder
    depends_on:
      swap-ingest:
        condition: service_healthy
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - MIN_PROFIT_THRESHOLD=${MIN_PROFIT_THRESHOLD:-1.001}
      - MAX_PATH_LENGTH=${MAX_PATH_LENGTH:-5}
      - SCAN_INTERVAL_SECONDS=${SCAN_INTERVAL_SECONDS:-1}
      - METRICS_PORT=9090
      - RUST_LOG=${RUST_LOG:-info}
      - HEARTBEAT_INTERVAL=30
      - MAX_CONCURRENT_PATHS=100
      - PATH_CACHE_TTL=300
    ports:
      - "9095:9090"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pathfinder"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # =============================================================================
  # MONITORING & DEBUGGING
  # =============================================================================

  redis-viewer:
    build:
      context: ../Arbitrage/solana-arbitrage/redis-viewer
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    image: arbitrage-redis-viewer:latest
    container_name: redis-viewer
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=5001
      - REFRESH_INTERVAL=5
    ports:
      - "5001:5001"
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - mevana-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Grafana for metrics visualization
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    networks:
      - mevana-network
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # =============================================================================
  # DATABASE SERVICES
  # =============================================================================

  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mevpassword}
      POSTGRES_DB: ${POSTGRES_DB:-mevdb}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    networks:
      - mevana-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mev} -d ${POSTGRES_DB:-mevdb}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  adminer:
    image: adminer
    container_name: adminer
    ports:
      - "8081:8080"
    networks:
      - mevana-network
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'

  # =============================================================================
  # DEVELOPMENT SERVICES (Optional)
  # =============================================================================

  # Development service with hot reloading
  stream-orca-dev:
    build:
      context: ..
      dockerfile: stream-orca/Dockerfile.dev
    environment:
      - SHYFT_GRPC_ENDPOINT=${SHYFT_GRPC_ENDPOINT}
      - SHYFT_GRPC_TOKEN=${SHYFT_GRPC_TOKEN}
      - REDIS_URL=redis://redis:6379
      - RUST_LOG=${RUST_LOG:-debug}
      - HEARTBEAT_INTERVAL=30
    volumes:
      - ../stream-orca:/app
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    networks:
      - mevana-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "cargo-watch"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    profiles:
      - dev
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # =============================================================================
  # CACHE LAYERS (for faster rebuilds)
  # =============================================================================

  stream-orca-cache:
    build:
      context: ..
      dockerfile: stream-orca/Dockerfile
      target: builder
    image: arbitrage-stream-orca:cache
    profiles:
      - cache

  stream-raydium-cache:
    build:
      context: ../stream-raydium
      dockerfile: Dockerfile
      target: builder
    image: arbitrage-stream-raydium:cache
    profiles:
      - cache

networks:
  mevana-network:
    driver: bridge
    name: mevana-network
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  cargo_cache:
    driver: local
  target_cache:
    driver: local

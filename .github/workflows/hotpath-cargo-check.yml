name: Hotpath Cargo Check (Linux)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check hotpath
        run: |
          RUSTFLAGS="--cap-lints warn" cargo +nightly check -p hotpath_arb_engine -q || true
          echo "\n--- Full cargo check output (without -q) for errors ---\n"
          cargo +nightly check -p hotpath_arb_engine


name: Cargo Check (Self-Hosted)
run-name: "Cargo Check (Self-Hosted): workspace on server"

on:
  workflow_dispatch:

concurrency:
  group: self-hosted-cargo-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system build deps
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            protobuf-compiler pkg-config libssl-dev librdkafka-dev \
            build-essential clang cmake curl git

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Cargo check (workspace)
        run: |
          set -euo pipefail
          RUSTFLAGS="--cap-lints warn" cargo +nightly check --workspace -q || true
          echo "\n--- Re-running without -q to show full errors if any ---\n"
          cargo +nightly check --workspace


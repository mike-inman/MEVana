name: Build and Deploy (GHCR)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      rollback_sha:
        description: 'Rollback to specific image tag (commit SHA). Leave empty to deploy latest.'
        required: false
        default: ''

concurrency:
  group: ghcr-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/mike-inman

jobs:
  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      services: ${{ steps.set-matrix.outputs.services }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes for hotpath
        id: hotpath
        uses: tj-actions/changed-files@v44
        with:
          files: |
            crates/hotpath_arb_engine/**
            crates/shared-core/**
            crates/shared-protocol/**

      - name: Detect changes for normalizer
        id: normalizer
        uses: tj-actions/changed-files@v44
        with:
          files: |
            crates/normalizer-service/**
            crates/normalizer-runtime/**
            crates/normalizer-codegen/**
            crates/shared-core/**
            crates/shared-protocol/**

      - name: Detect changes for discovery
        id: discovery
        uses: tj-actions/changed-files@v44
        with:
          files: |
            crates/discovery-service/**
            crates/shared-core/**

      - name: Detect changes for executor
        id: executor
        uses: tj-actions/changed-files@v44
        with:
          files: |
            crates/executor-service/**
            crates/edge-assembler/**
            crates/whirlpool-core/**
            crates/shared-protocol/**
            crates/shared-core/**

      - name: Prepare dynamic matrix
        id: set-matrix
        run: |
          changed=()
          [[ "${{ steps.hotpath.outputs.any_changed }}" == 'true' ]] && changed+=(hotpath)
          [[ "${{ steps.normalizer.outputs.any_changed }}" == 'true' ]] && changed+=(normalizer)
          [[ "${{ steps.discovery.outputs.any_changed }}" == 'true' ]] && changed+=(discovery)
          [[ "${{ steps.executor.outputs.any_changed }}" == 'true' ]] && changed+=(executor)
          if [ ${#changed[@]} -eq 0 ]; then
            echo 'matrix=["none"]' >> "$GITHUB_OUTPUT"
            echo 'services=' >> "$GITHUB_OUTPUT"
          else
            json='["'"${changed[0]}"'"'
            for ((i=1;i<${#changed[@]};i++)); do json+=',"'"${changed[$i]}"'"'; done
            json+=']'
            echo "matrix=$json" >> "$GITHUB_OUTPUT"
            echo "services=${changed[*]}" >> "$GITHUB_OUTPUT"
          fi
  build-push:
    name: Build and push images
    runs-on: ubuntu-latest
    needs: detect
    if: ${{ needs.detect.outputs.matrix != '["none"]' }}
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install build prerequisites (executor only)
        if: matrix.service == 'executor'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Docker login to GHCR (build)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push with cache
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/mevana-${{ matrix.service == 'hotpath' && 'hotpath-arb-engine' || matrix.service }}:${{ github.sha }}
          file: |
            ${{ matrix.service == 'hotpath' && 'crates/hotpath_arb_engine/Dockerfile' || matrix.service == 'normalizer' && 'crates/normalizer-service/Dockerfile' || matrix.service == 'discovery' && 'crates/discovery-service/Dockerfile' || 'crates/executor-service/executor-service.Dockerfile' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to server
    needs: [detect, build-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (needs.detect.outputs.matrix != '["none"]' || github.event.inputs.rollback_sha != '')
    steps:
      - name: SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VULTR_SERVER_SSH_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync compose files to server
        run: |
          # Fail fast if dashboards are placed outside the Grafana path
          if ls "${{ github.workspace }}/dashboards"/*.json >/dev/null 2>&1; then
            echo "Error: Found dashboards/ at repo root. Move JSON files to infrastructure/grafana/dashboards/" >&2
            exit 1
          fi
          stray=$(find "${{ github.workspace }}" -type f -name '*.json' -path '*/dashboards/*' ! -path '*/infrastructure/grafana/dashboards/*' | wc -l)
          if [ "$stray" -gt 0 ]; then
            echo "Error: Found dashboard JSON files outside infrastructure/grafana/dashboards/. Please relocate them." >&2
            find "${{ github.workspace }}" -type f -name '*.json' -path '*/dashboards/*' ! -path '*/infrastructure/grafana/dashboards/*'
            exit 1
          fi
          # Create archive from the repository root explicitly
          tar -C "${{ github.workspace }}" -czf "${{ github.workspace }}/infra.tgz" infrastructure
          # Copy archive to the server
          scp "${{ github.workspace }}/infra.tgz" ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/tmp/infra.tgz
          # Extract into SERVER_DIR (defaults to /opt/MEVana if unset)
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} 'mkdir -p ${SERVER_DIR:-/opt/MEVana} && tar -xzf /tmp/infra.tgz -C ${SERVER_DIR:-/opt/MEVana}'

      - name: Deploy via SSH (restart only changed services or rollback)
        env:
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
          HOTPATH_ENDPOINT: ${{ secrets.HOTPATH_ENDPOINT }}
          HOTPATH_X_TOKEN: ${{ secrets.HOTPATH_X_TOKEN }}
          CHANGED_SERVICES: ${{ needs.detect.outputs.services }}
          ROLLBACK_SHA: ${{ github.event.inputs.rollback_sha }}
        run: |
          SHA=${{ github.sha }}
          if [ -n "${ROLLBACK_SHA}" ]; then SHA="${ROLLBACK_SHA}"; fi
          CHANGED="${CHANGED_SERVICES}"
          # Attempt GHCR login only if secrets provided; for public images this is skipped
          LOGIN_CMD="true"; if [ -n "${GHCR_TOKEN}" ] && [ -n "${GHCR_USERNAME}" ]; then LOGIN_CMD="echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_USERNAME}' --password-stdin"; fi
          ssh ${SSH_USER}@${SSH_HOST} "set -e; cd '${SERVER_DIR:-/opt/MEVana}'; ${LOGIN_CMD} || echo 'Skipping GHCR login'; \
            if [ -n '${HOTPATH_ENDPOINT}' ] && [ -n '${HOTPATH_X_TOKEN}' ]; then mkdir -p infrastructure; printf 'ENDPOINT=%s\nX_TOKEN=%s\n' '${HOTPATH_ENDPOINT}' '${HOTPATH_X_TOKEN}' > infrastructure/.env; fi; \
            export MEVANA_TAG='${SHA}'; docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml pull || true; \
            map_service(){ case \"$1\" in hotpath) echo hotpath-arb-engine;; normalizer) echo normalizer-service;; discovery) echo discovery-service;; executor) echo executor-service;; edge) echo edge-assembler;; arb) echo arb-engine;; token) echo token-registry-service;; monitoring) echo monitoring-service;; esac; }; \
            if [ -n '${ROLLBACK_SHA}' ]; then to_restart=(hotpath-arb-engine normalizer-service discovery-service executor-service edge-assembler arb-engine token-registry-service monitoring-service); \
              echo Rollback tag: '${ROLLBACK_SHA}' && docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml up -d ${to_restart[*]}; \
            elif [ -n '${CHANGED}' ]; then to_restart=(); for s in ${CHANGED}; do to_restart+=( \"$(map_service \"$s\")\" ); done; echo Restarting: \"${to_restart[*]}\"; docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml up -d ${to_restart[*]}; else echo 'No services changed'; fi; \
            docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml ps"

      - name: Healthcheck (hotpath)
        if: contains(needs.detect.outputs.services, 'hotpath')
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_DIR: ${{ secrets.SERVER_DIR }}
        run: |
          ssh ${SSH_USER}@${SSH_HOST} bash -s << 'EOF'
          set -e
          i=0
          until curl -sf http://localhost:8088/metrics >/dev/null 2>&1; do
            i=$((i+1)); [ $i -gt 20 ] && { echo "hotpath healthcheck failed"; exit 1; }
            sleep 5
          done
          echo "hotpath healthy"
          EOF

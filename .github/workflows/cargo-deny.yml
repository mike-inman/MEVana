name: Cargo Deny (Deps & Licenses)

on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    # Warn-only on PRs and pushes; authoritative on schedule/manual
    continue-on-error: ${{ github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cargo-deny (advisories, bans, licenses)
        id: deny
        uses: EmbarkStudios/cargo-deny-action@v1
        with:
          command: check
          arguments: "--all-features"

      - name: Open issue on failure (scheduled/manual)
        if: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && failure() }}
        uses: actions/github-script@v7
        with:
          script: |
            const title = `cargo-deny failures detected (${new Date().toISOString().slice(0,10)})`;
            const body = `cargo-deny reported dependency or license issues.\n\nPlease run locally:\n\n\n\tcargo deny check\n\n\nThen address advisories or update deny.toml as appropriate.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['dependencies','security']
            });

name: Restart (Self-Hosted)
run-name: "Restart (Self-Hosted): services=${{ inputs.services || 'default' }}"

concurrency:
  group: self-hosted-restart-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated services to restart (e.g., hotpath normalizer discovery executor). Empty = all app services"
        required: false
        default: "hotpath"

jobs:
  restart:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve services
        id: vars
        shell: bash
        run: |
          map_service(){ case "$1" in hotpath) echo hotpath-arb-engine;; normalizer) echo normalizer-service;; discovery) echo discovery-service;; executor) echo executor-service;; *) echo "$1";; esac; }
          S="${{ github.event.inputs.services }}"; OUT=()
          if [ -n "$S" ]; then for sv in $S; do OUT+=("$(map_service "$sv")"); done; else OUT=(hotpath-arb-engine normalizer-service discovery-service executor-service); fi
          echo "services=${OUT[*]}" >> "$GITHUB_OUTPUT"

      - name: Restart services (compose up -d)
        run: |
          set -euo pipefail
          svcs=( ${{ steps.vars.outputs.services }} )
          cd /opt/MEVana
          # Load last deployed tag if present, so compose doesn't default to :dev and pull
          if [ -f /opt/MEVana/.mevana_tag ]; then
            export MEVANA_TAG=$(cat /opt/MEVana/.mevana_tag)
            echo "Using MEVANA_TAG=${MEVANA_TAG} from /opt/MEVana/.mevana_tag"
          else
            echo "Warning: /opt/MEVana/.mevana_tag missing; MEVANA_TAG defaults to 'dev' and may trigger a GHCR pull"
          fi
          docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml up -d ${svcs[*]}
          docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml ps

name: Fast Deploy - hotpath_arb_engine

on:
  push:
    branches: [ main ]
    paths:
      - 'crates/hotpath_arb_engine/**'
      - 'infrastructure/grafana/dashboards/hotpath-arb-engine-*.json'
      - '.github/workflows/deploy-multi-geyser.yml'
  workflow_dispatch: {}

env:
  SERVER_HOST: 149.28.56.125
  SERVER_USER: root
  DEPLOYMENT_PATH: /opt/MEVana

jobs:
  deploy-mgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build hotpath_arb_engine (release)
        run: |
          cargo build -p hotpath_arb_engine --release --locked

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VULTR_SERVER_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

      - name: Upload updated binary and dashboard
        run: |
          scp target/release/hotpath_arb_engine $SERVER_USER@$SERVER_HOST:$DEPLOYMENT_PATH/target/release/hotpath_arb_engine
          if [ -f infrastructure/grafana/dashboards/hotpath-arb-engine-bar-charts.json ]; then
            scp infrastructure/grafana/dashboards/hotpath-arb-engine-bar-charts.json $SERVER_USER@$SERVER_HOST:$DEPLOYMENT_PATH/infrastructure/grafana/dashboards/
          fi

      - name: Restart hotpath_arb_engine and verify
        run: |
          ssh $SERVER_USER@$SERVER_HOST << 'ENDSSH'
            set -e
            cd /opt/MEVana
            echo "Stopping old hotpath_arb_engine..."
            pkill -f "hotpath_arb_engine" || true
            sleep 2
            echo "Starting new hotpath_arb_engine..."
            mkdir -p logs
            nohup bash -c '
              export GEYSER_ENDPOINT="https://grpc.ny.shyft.to"
              export X_TOKEN="efff2d23-97ae-4c5f-8b8b-9a6265001189"
              export METRICS_PORT=8088
              ./target/release/hotpath_arb_engine --verbose
            ' > logs/hotpath_arb_engine.log 2>&1 &
            # wait for metrics
            for i in {1..12}; do
              if curl -s http://localhost:8088/metrics | grep -q hotpath_arb_engine; then
                echo "Metrics healthy"
                break
              fi
              echo "Waiting for metrics ($i/12)..."; sleep 5
            done
            if ! curl -s http://localhost:8088/metrics | grep -q hotpath_arb_engine; then
              echo "Metrics endpoint not healthy"; exit 1
            fi
          ENDSSH

      - name: Summary
        run: |
          echo "Deployed hotpath_arb_engine to $SERVER_HOST" >> $GITHUB_STEP_SUMMARY
          echo "Metrics: http://$SERVER_HOST:8088/metrics" >> $GITHUB_STEP_SUMMARY
          echo "Grafana: http://$SERVER_HOST:3000" >> $GITHUB_STEP_SUMMARY

name: Auto Assign & Label Issues

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  auto-assign:
    runs-on: ubuntu-latest
    steps:
      - name: Auto-assign issue to maintainer
        uses: actions/github-script@v7
        with:
          script: |
            const assignee = 'mike-inman';
            if (!context.payload.issue.assignees.some(a => a.login === assignee)) {
              await github.rest.issues.addAssignees({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                assignees: [assignee]
              });
            }
      - name: Heuristic labeling (observability/performance/reliability/testing/tooling)
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.issue.body || '').toLowerCase();
            const title = (context.payload.issue.title || '').toLowerCase();
            const text = title + '\n' + body;
            const labelMap = [
              { label: 'observability', keywords: ['metric', 'metrics', 'trace', 'tracing', 'histogram', 'logging', 'observab'] },
              { label: 'performance', keywords: ['perf', 'latency', 'throughput', 'optimiz', 'bench'] },
              { label: 'reliability', keywords: ['reliab', 'stale', 'circuit', 'failover', 'retry', 'cooldown'] },
              { label: 'testing', keywords: ['test', 'fuzz', 'fixture', 'snapshot'] },
              { label: 'tooling', keywords: ['harness', 'tool', 'script', 'workflow'] },
            ];
            const existing = context.payload.issue.labels.map(l => l.name);
            const toAdd = [];
            for (const m of labelMap) {
              if (m.keywords.some(k => text.includes(k)) && !existing.includes(m.label)) {
                toAdd.push(m.label);
              }
            }
            if (toAdd.length) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: toAdd
              });
            }
      - name: Add status label (Inbox) if none present
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const hasStatus = issue.labels.some(l => l.name.startsWith('status:'));
            if (!hasStatus) {
              // Ensure label exists (best-effort; ignore failure if already exists)
              try {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: 'status:inbox',
                  color: 'ededed'
                });
              } catch (e) {}
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                labels: ['status:inbox']
              });
            }

name: Deploy to Production Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deployment even if no changes'
        required: false
        default: false
        type: boolean

env:
  SERVER_HOST: 149.28.56.125
  SERVER_USER: root
  DEPLOYMENT_PATH: /opt/MEVana

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.VULTR_SERVER_SSH_KEY }}
        
    - name: Add server to known hosts
      run: |
        ssh-keyscan -H $SERVER_HOST >> ~/.ssh/known_hosts

    - name: Package source for deploy
      run: |
        tar --exclude='.git' --exclude='target' --exclude='*.tar.gz' -czf mevana-src.tar.gz . || { echo "Warning: tar had minor issues but archive created"; exit 0; }

    - name: Upload source to server
      run: |
        scp mevana-src.tar.gz $SERVER_USER@$SERVER_HOST:/tmp/mevana-src.tar.gz
        
    - name: Deploy to server
      run: |
        ssh -T $SERVER_USER@$SERVER_HOST << 'ENDSSH'
          set -e
          
          echo "🚀 Starting MEVana deployment..."
          
          # Navigate to deployment directory
          mkdir -p /opt/MEVana
          cd /opt/MEVana
          
          # Update code from uploaded archive
          echo "📦 Updating code from uploaded archive..."
          tar -xzf /tmp/mevana-src.tar.gz -C /opt/MEVana
          
          # Stop existing services gracefully
          echo "🛑 Stopping existing services..."
          pkill -f "arb-engine" || true
          pkill -f "whirlpool-live-stream" || true
          pkill -f "hotpath_arb_engine" || true
          pkill -f "hotpath_arb_engine" || true
          sleep 5
          
          # Build latest version
          echo "🔨 Building services..."
          export PATH="$HOME/.cargo/bin:$PATH"
          
          # Clean build for reliability
          cargo clean
          cargo build --release --workspace --verbose
          
          if [ $? -ne 0 ]; then
            echo "❌ Build failed"
            cat /tmp/cargo-build.log || true
            exit 1
          fi
          
          # Create logs directory
          mkdir -p logs
          
          # Start infrastructure if not running
          echo "🐋 Ensuring infrastructure is running..."
          cd infrastructure
          
          # Check if Docker services are running, start if needed
          echo "Checking Docker network..."
          if ! docker network ls | grep -q mevana_net; then
            echo "Creating Docker network..."
            docker network create mevana_net
          else
            echo "Docker network mevana_net already exists"
          fi
          
          if ! docker ps | grep -q kafka; then
            echo "Starting infrastructure services..."
            docker compose up -d
            sleep 30
          else
            echo "Infrastructure already running"
          fi
          
          cd ..
          
          # Create venue configuration
          cat > venue_config.env << 'EOF'
          # Multi-venue configuration
          ORCA_PROGRAM_ID=whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc
          RAYDIUM_PROGRAM_ID=675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8
          METEORA_PROGRAM_ID=Eo7WjKq67rjJQSZxS6z3YkapzY3eMj6Xy8X5EQVn5UaB
          PHOENIX_PROGRAM_ID=PhoeNiXZ8ByJGLkxNfZRnkUfjvmuYqLR89jjFHGqdXY
          
          # Venue filtering (all enabled)
          ENABLE_ORCA=true
          ENABLE_RAYDIUM=true
          ENABLE_METEORA=true
          ENABLE_PHOENIX=true
          
          # Jupiter integration
          ENABLE_JUPITER=true
          JUPITER_API_URL=https://quote-api.jup.ag/v6
          JUPITER_MAX_HOPS=3
          
          # Performance settings
          ARB_MIN_PROFIT_BPS=5
          ARB_MAX_SLIPPAGE_BPS=100
          HOTPATH_LOG=true
          EOF
          
          # Start discovery stream
          echo "📡 Starting Orca discovery stream..."
          nohup bash -c "
              source venue_config.env
              ENDPOINT=https://grpc.ny.shyft.to \
              X_TOKEN=efff2d23-97ae-4c5f-8b8b-9a6265001189 \
              KAFKA_BROKER=localhost:29092 \
              PROGRAM_IDS=whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc \
              ./target/release/whirlpool-live-stream
          " > logs/orca-discovery.log 2>&1 &
          
          ORCA_PID=$!
          echo "Orca discovery started (PID: $ORCA_PID)"
          
          # Wait for discovery to establish
          sleep 10
          
          # Start arbitrage engine with Jupiter
          echo "⚡ Starting arbitrage engine with Jupiter integration..."
          nohup bash -c "
              source venue_config.env
              KAFKA_BROKER=localhost:29092 \
              HOTPATH_LOG=true \
              ARB_MIN_PROFIT_BPS=5 \
              ARB_MAX_SLIPPAGE_BPS=100 \
              WS_BIND=0.0.0.0:8085 \
              ENABLE_JUPITER=true \
              JUPITER_API_URL=https://quote-api.jup.ag/v6 \
              JUPITER_MAX_HOPS=3 \
              ./target/release/arb-engine
          " > logs/arb-engine.log 2>&1 &
          
          ARB_PID=$!
          echo "Arbitrage engine started (PID: $ARB_PID)"
          # hotpath_arb_engine will be started in a separate step
          
          # Wait for services to initialize
          sleep 15
          
          # Health check
          echo "🔍 Running health checks..."
          
          # Wait for services to fully initialize
          echo "⏳ Waiting for services to initialize..."
          sleep 20
          
          # Check if API is responding with retry logic
          for i in {1..5}; do
            if curl -s http://localhost:8085/ai/config >/dev/null 2>&1; then
              echo "✅ Arbitrage engine API is healthy (attempt $i)"
              break
            else
              echo "⏳ Arbitrage engine API not ready (attempt $i/5)..."
              sleep 10
            fi
          done
          
          # Check if processes are running
          if pgrep -f "arb-engine" >/dev/null; then
            echo "✅ Arbitrage engine process is running"
          else
            echo "❌ Arbitrage engine process failed to start"
            exit 1
          fi
          
          if pgrep -f "whirlpool-live-stream" >/dev/null; then
            echo "✅ Discovery stream process is running"  
          else
            echo "❌ Discovery stream process failed to start"
            exit 1
          fi

          
          echo "🎉 Deployment completed successfully!"
          echo ""
          echo "📊 Service Status:"
          echo "   • Kafka UI:      http://149.28.56.125:8080"
          echo "   • Arbitrage API: http://149.28.56.125:8085/ai/config"
          echo "   • Grafana:       http://149.28.56.125:3000"
          echo "   • Redis UI:      http://149.28.56.125:8083"
          echo ""
          echo "🤖 AI Trading Engine:"
          echo "   • Arbitrage Engine: PID $ARB_PID (logs/arb-engine.log)"
          echo "   • Discovery Stream: PID $ORCA_PID (logs/orca-discovery.log)"
          echo ""
          echo "📈 Paper Trading Mode Active:"
          echo "   • All venues: Orca, Raydium, Meteora, Phoenix"
          echo "   • Jupiter multi-hop routing: ENABLED"
          echo "   • Minimum profit: 5 BPS"
        ENDSSH
        
    - name: Start hotpath_arb_engine
      run: |
        ssh -T $SERVER_USER@$SERVER_HOST << 'ENDSSH'
          set -e
          cd /opt/MEVana
          echo "📊 Starting hotpath_arb_engine..."
          mkdir -p logs
          nohup bash -c '
              export GEYSER_ENDPOINT="${GEYSER_ENDPOINT:-https://grpc.ny.shyft.to}"
              export X_TOKEN="${X_TOKEN:-efff2d23-97ae-4c5f-8b8b-9a6265001189}"
              export METRICS_PORT=8088
              ./target/release/hotpath_arb_engine --verbose
          ' > logs/hotpath_arb_engine.log 2>&1 &
          echo "Started hotpath_arb_engine; tail logs/hotpath_arb_engine.log"
        ENDSSH

    - name: Test deployment
      run: |
        echo "🔍 Testing deployment..."
        
        # Wait longer for services to fully start
        sleep 30
        
        # Run diagnostic checks
        echo "🔍 Running deployment diagnostics..."
        
        echo "=== Process Check ==="
        ssh -T -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'pgrep -f "hotpath_arb_engine" && echo "✅ hotpath_arb_engine process running" || echo "❌ hotpath_arb_engine process not found"'
        ssh -T -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'pgrep -f "arb-engine" && echo "✅ arb-engine process running" || echo "❌ arb-engine process not found"'
        
        echo "=== Port Check ==="
        ssh -T -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'lsof -i:8088 && echo "✅ Port 8088 (hotpath) is in use" || echo "❌ Port 8088 (hotpath) is free"'
        ssh -T -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'lsof -i:8085 && echo "✅ Port 8085 (arb-engine) is in use" || echo "❌ Port 8085 (arb-engine) is free"'
        
        echo "=== Service Logs ==="
        ssh -T -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'tail -20 /opt/MEVana/logs/hotpath_arb_engine.log || echo "❌ HotPath log file not found"'
        ssh -T -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'tail -10 /opt/MEVana/logs/arb-engine.log || echo "❌ Arb-engine log file not found"'
        
        echo "=== Docker Status ==="
        ssh -T -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_HOST 'docker ps | grep kafka || echo "❌ Kafka not running"'
        
        # Test BOTH endpoints
        echo "=== Testing HotPath Engine ==="
        HOTPATH_SUCCESS=false
        for i in {1..10}; do
          if curl -s --connect-timeout 5 http://$SERVER_HOST:8088/metrics 2>/dev/null | head -5; then
            echo "✅ HotPath engine is responding (attempt $i)"
            HOTPATH_SUCCESS=true
            break
          else
            echo "⏳ HotPath not ready (attempt $i/10)..."
            sleep 5
          fi
        done
        
        echo "=== Testing Arb Engine ==="
        ARB_SUCCESS=false
        for i in {1..10}; do
          if curl -s --connect-timeout 5 http://$SERVER_HOST:8085/ai/config 2>/dev/null; then
            echo "✅ Arb engine is responding (attempt $i)"
            ARB_SUCCESS=true
            break
          else
            echo "⏳ Arb engine not ready (attempt $i/10)..."
            sleep 5
          fi
        done
        
        # Require at least HotPath to be working
        if [ "$HOTPATH_SUCCESS" = true ]; then
          echo "✅ Deployment test passed - HotPath engine is operational!"
          exit 0
        else
          echo "❌ Deployment test failed - HotPath engine not responding"
          exit 1
        fi
        
    - name: Notify deployment status
      if: always()
      run: |
        if [ ${{ job.status }} == 'success' ]; then
          echo "✅ MEVana deployment to production successful!"
          echo "🚀 HotPath Engine: http://$SERVER_HOST:8088/metrics"
          echo "⚡ Arb Engine: http://$SERVER_HOST:8085/ai/config"
          echo "📊 Kafka UI: http://$SERVER_HOST:8080"
          echo "📈 Grafana: http://$SERVER_HOST:3000"
          echo "🎯 Ready for MAD MAX MEV TRADING!"
        else
          echo "❌ MEVana deployment failed"
        fi
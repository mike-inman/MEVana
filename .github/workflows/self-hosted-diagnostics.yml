name: Diagnostics (Self-Hosted)
run-name: "Diagnostics (Self-Hosted): services=${{ inputs.services || 'default' }}"

concurrency:
  group: self-hosted-diagnostics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated services to inspect (e.g., hotpath normalizer discovery executor). Empty = all app services"
        required: false
        default: "hotpath"

jobs:
  diag:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose status
        run: |
          cd /opt/MEVana
          docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml ps || true

      - name: Show env files (redacted)
        run: |
          set -euo pipefail
          for f in /opt/MEVana/.env /opt/MEVana/infrastructure/.env; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              awk 'BEGIN{FS="="} /^X_TOKEN=/{v=$2; n=length(v); if(n>8){print $1"="substr(v,1,4)"****"substr(v,n-3,4)} else {print $1"=****"}} !/^X_TOKEN=/{print}' "$f"
            else
              echo "(missing) $f"
            fi
          done
          if [ -f /opt/MEVana/.mevana_tag ]; then
            echo "--- /opt/MEVana/.mevana_tag ---"
            cat /opt/MEVana/.mevana_tag
          else
            echo "(missing) /opt/MEVana/.mevana_tag"
          fi

      - name: Resolve services
        id: vars
        shell: bash
        run: |
          map_service(){ case "$1" in hotpath) echo hotpath-arb-engine;; normalizer) echo normalizer-service;; discovery) echo discovery-service;; executor) echo executor-service;; *) echo "$1";; esac; }
          S="${{ github.event.inputs.services }}"; OUT=()
          if [ -n "$S" ]; then for sv in $S; do OUT+=("$(map_service "$sv")"); done; else OUT=(hotpath-arb-engine normalizer-service discovery-service executor-service); fi
          echo "services=${OUT[*]}" >> "$GITHUB_OUTPUT"

      - name: Logs (tail)
        run: |
          set +e
          svcs=( ${{ steps.vars.outputs.services }} )
          for s in ${svcs[*]}; do
            echo "--- LOGS: $s ---"
            docker ps --format '{{.Names}}' | grep -E "mevana-$s-1|$s" | xargs -I{} sh -c 'docker logs --tail=200 {} 2>&1 | tail -n 200 || true'
          done

      - name: Container env (hotpath, redacted)
        run: |
          set +e
          cid=$(docker ps --format '{{.ID}} {{.Names}}' | awk '/hotpath-arb-engine/{print $1; exit}')
          if [ -n "$cid" ]; then
            echo "--- hotpath env (redacted) ---"
            docker exec "$cid" sh -c 'env | grep -E "^(ENDPOINT|X_TOKEN|METRICS_PORT)="' | awk 'BEGIN{FS="="} /^X_TOKEN=/{v=$2; n=length(v); if(n>8){print $1"="substr(v,1,4)"****"substr(v,n-3,4)} else {print $1"=****"}} !/^X_TOKEN=/{print}'
          else
            echo "hotpath container not found"
          fi
      - name: Prometheus ↔ Hotpath connectivity
        run: |
          set +e
          pcid=$(docker ps --format '{{.ID}} {{.Names}}' | awk '/prometheus/{print $1; exit}')
          if [ -n "$pcid" ]; then
            echo "--- curl from prometheus container to hotpath:8088/metrics (head) ---"
            docker exec "$pcid" sh -lc 'curl -s --connect-timeout 5 http://hotpath-arb-engine:8088/metrics | head -n 10' || true
            echo "--- Prometheus active targets (hotpath) ---"
            curl -s http://localhost:9090/api/v1/targets | jq -r '.data.activeTargets[] | select(.labels.job=="hotpath-arb-engine") | (.health + " " + .discoveredLabels.__address__ + " " + .scrapeUrl)' || true
          else
            echo "prometheus container not found"
          fi

      - name: Quick HTTP checks
        run: |
          set +e
          echo "Grafana:"; curl -s -o /dev/null -w "%{http_code}\n" --connect-timeout 5 http://localhost:3000/api/health || true
          echo "Prometheus:"; curl -s -o /dev/null -w "%{http_code}\n" --connect-timeout 5 http://localhost:9090/-/healthy || true
          echo "Hotpath metrics head:"; curl -s --connect-timeout 5 http://localhost:8088/metrics | head -n 5 || true

name: Staging Smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: [ main ]

jobs:
  smoke:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build smoke test
        run: cargo build -p executor-service --bin smoke_test --release
      - name: Run smoke test
        env:
          TOKEN_REGISTRY_SNAPSHOT_PATH: token_registry_snapshot.json
        run: |
          REG_FILE=$(ls profiles/account_registry*.json 2>/dev/null | head -n1 || true)
          if [ -z "$REG_FILE" ]; then
            echo "No registry file found for smoke test"; exit 1; fi
          ./target/release/smoke_test "$REG_FILE" So11111111111111111111111111111111111111112

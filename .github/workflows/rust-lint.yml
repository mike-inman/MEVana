name: Rust Lint & Format

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    # Allow a lenient escape hatch on PRs via label `ci:lenient`
    continue-on-error: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:lenient') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust nightly with components
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (fast check)
        run: cargo build --workspace --locked

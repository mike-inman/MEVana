name: Pre-Deployment Validation
run-name: "Pre-Deployment Validation: Server readiness and infrastructure analysis"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to validate'
        required: true
        default: 'production'
        type: choice
        options:
        - production
        - staging

permissions:
  contents: read
  issues: write

jobs:
  validate-server:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pre-Deployment Discovery
        run: |
          set -euo pipefail
          cd /opt/MEVana
          echo "🔍 Running comprehensive infrastructure discovery..."

          # Make scripts executable
          chmod +x scripts/ci/*.sh

          # Run infrastructure discovery
          echo "📊 Current server state analysis:"
          ./scripts/ci/comprehensive-infrastructure-discovery.sh || echo "Discovery completed with warnings"

      - name: Deployment Readiness Test
        run: |
          set -euo pipefail
          cd /opt/MEVana
          echo "🧪 Testing deployment readiness..."

          # Run deployment readiness test
          if ./scripts/ci/deployment-readiness-test.sh; then
            echo "✅ Server is ready for deployment!"
            echo "🚀 You can now run the 'Build and Deploy (Self-Hosted)' workflow"
          else
            echo "❌ Server needs alignment before deployment"
            echo "🔧 Review the issues above and fix them"
            exit 1
          fi

      - name: Generate Validation Report
        if: always()
        run: |
          cd /opt/MEVana
          echo "📋 Generating validation report..."

          # Check if report directory exists
          mkdir -p deployment-reports

          # Create validation report
          REPORT_FILE="deployment-reports/pre-deployment-validation-$(date +%Y%m%d-%H%M%S).md"

          cat > "$REPORT_FILE" << EOF
          # Pre-Deployment Validation Report

          **Date**: $(date)
          **Server**: $(hostname) ($(hostname -I | awk '{print $1}'))
          **Environment**: ${{ github.event.inputs.environment }}
          **Working Directory**: $(pwd)

          ## Validation Summary

          $(if [ $? -eq 0 ]; then echo "✅ **READY FOR DEPLOYMENT**"; else echo "❌ **NOT READY - REQUIRES FIXES**"; fi)

          ## Current Service Status

          \`\`\`
          $(docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" 2>/dev/null || echo "No containers running")
          \`\`\`

          ## Next Steps

          $(if [ $? -eq 0 ]; then
            echo "1. ✅ Validation passed - server is ready"
            echo "2. 🚀 Run 'Build and Deploy (Self-Hosted)' workflow"
            echo "3. 📊 Monitor deployment progress"
          else
            echo "1. 🔧 Fix the alignment issues listed above"
            echo "2. 🔄 Re-run this validation workflow"
            echo "3. 🚀 Deploy only after validation passes"
          fi)

          ---
          *Generated by MEVana Pre-Deployment Validation*
          EOF

          echo "📄 Validation report saved: $REPORT_FILE"

      - name: Create GitHub Issue on Failure
        if: failure()
        run: |
          cd /opt/MEVana
          echo "🐙 Creating GitHub issue for validation failure..."

          if command -v gh >/dev/null 2>&1 && gh repo view >/dev/null 2>&1; then
            # Get the latest report
            LATEST_REPORT=$(ls -t deployment-reports/pre-deployment-validation-*.md 2>/dev/null | head -1)

            if [ -n "$LATEST_REPORT" ] && [ -f "$LATEST_REPORT" ]; then
              REPORT_CONTENT=$(cat "$LATEST_REPORT")

              gh issue create \
                --title "🚨 Pre-Deployment Validation Failed" \
                --body "$REPORT_CONTENT" \
                --label "deployment,validation-failed,needs-attention" \
                --assignee "@me" || echo "Could not create GitHub issue"
            fi
          else
            echo "GitHub CLI not available - skipping issue creation"
          fi
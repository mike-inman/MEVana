name: Build and Deploy (Self-Hosted)
run-name: "Build and Deploy (Self-Hosted): all app services, local build"

concurrency:
  group: self-hosted-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker network
        run: docker network create mevana_net 2>/dev/null || true

      - name: Sync infrastructure to /opt/MEVana
        run: |
          set -euo pipefail
          mkdir -p /opt/MEVana
          rsync -a --delete infrastructure/ /opt/MEVana/infrastructure/

      - name: Write infra env (optional)
        env:
          EP_A: ${{ secrets.HOTPATH_ENDPOINT }}
          EP_B: ${{ secrets.ENDPOINT }}
          XT_A: ${{ secrets.HOTPATH_X_TOKEN }}
          XT_B: ${{ secrets.X_TOKEN }}
        run: |
          EP="${EP_A:-${EP_B:-}}"
          XT="${XT_A:-${XT_B:-}}"
          if [ -n "$EP" ] && [ -n "$XT" ]; then
            mkdir -p /opt/MEVana /opt/MEVana/infrastructure
            printf "ENDPOINT=%s\nX_TOKEN=%s\n" "$EP" "$XT" | tee /opt/MEVana/infrastructure/.env > /opt/MEVana/.env
            echo "Wrote /opt/MEVana/.env and /opt/MEVana/infrastructure/.env"
          else
            echo "Skipping infra .env write (ENDPOINT/X_TOKEN secrets not set)"
          fi

      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          echo "services=hotpath-arb-engine normalizer-service discovery-service executor-service" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      # We always build locally on the server to avoid registry/auth issues

      - name: Build locally (explicit per-service)
        env:
          TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          svcs=( ${{ steps.vars.outputs.services }} )
          if [ ${#svcs[@]} -eq 0 ]; then svcs=(hotpath-arb-engine normalizer-service discovery-service executor-service); fi

          build_one() {
            local svc="$1"; local tag="$2"; local img=""; local df="";
            case "$svc" in
              hotpath-arb-engine)
                img="ghcr.io/mike-inman/mevana-hotpath-arb-engine:${tag}";
                df="crates/hotpath_arb_engine/Dockerfile";
                ;;
              normalizer-service)
                img="ghcr.io/mike-inman/mevana-normalizer-service:${tag}";
                df="crates/normalizer-service/Dockerfile";
                ;;
              discovery-service)
                img="ghcr.io/mike-inman/mevana-discovery-service:${tag}";
                df="crates/discovery-service/Dockerfile";
                ;;
              executor-service)
                img="ghcr.io/mike-inman/mevana-executor-service:${tag}";
                df="crates/executor-service/executor-service.Dockerfile";
                ;;
              edge-assembler)
                img="ghcr.io/mike-inman/mevana-edge-assembler:${tag}";
                df="crates/edge-assembler/Dockerfile";
                ;;
              arb-engine)
                img="ghcr.io/mike-inman/mevana-arb-engine:${tag}";
                df="crates/arb-engine/Dockerfile";
                ;;
              token-registry-service)
                img="ghcr.io/mike-inman/mevana-token-registry-service:${tag}";
                df="crates/token-registry-service/Dockerfile";
                ;;
              monitoring-service)
                img="ghcr.io/mike-inman/mevana-monitoring-service:${tag}";
                df="crates/monitoring-service/Dockerfile";
                ;;
              *)
                echo "Unknown service '$svc' — skipping local build" >&2; return 0;
                ;;
            esac
            echo "Building $svc -> $img using $df";
            docker build -t "$img" -f "$df" .
          }

          for s in "${svcs[@]}"; do
            build_one "$s" "$TAG"
          done

      - name: Pre-Deployment Discovery & Validation
        run: |
          set -euo pipefail
          cd /opt/MEVana
          echo "🔍 Running comprehensive infrastructure discovery..."

          # Make scripts executable
          chmod +x scripts/ci/*.sh

          # Run infrastructure discovery
          ./scripts/ci/comprehensive-infrastructure-discovery.sh || echo "Discovery completed with warnings"

      - name: Deploy Infrastructure
        env:
          MEVANA_TAG: ${{ steps.vars.outputs.tag }}
          # Set production image references
          HOTPATH_IMAGE: ghcr.io/mike-inman/mevana-hotpath-arb-engine:${{ steps.vars.outputs.tag }}
          NORMALIZER_IMAGE: ghcr.io/mike-inman/mevana-normalizer-service:${{ steps.vars.outputs.tag }}
          DISCOVERY_IMAGE: ghcr.io/mike-inman/mevana-discovery-service:${{ steps.vars.outputs.tag }}
          EXECUTOR_IMAGE: ghcr.io/mike-inman/mevana-executor-service:${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          cd /opt/MEVana
          # Persist the tag so Restart workflow can reuse it
          echo "${MEVANA_TAG}" > /opt/MEVana/.mevana_tag
          echo "Using MEVANA_TAG=${MEVANA_TAG} (persisted to /opt/MEVana/.mevana_tag)"

          # Clean up any existing containers to avoid conflicts
          echo "🧹 Cleaning up existing containers..."
          docker compose -f infrastructure/docker-compose.yml down || true

          # Start infrastructure services first
          echo "🏗️ Starting infrastructure services..."
          docker compose -f infrastructure/docker-compose.yml up -d prometheus grafana kafka redis postgres zookeeper kafka-ui adminer

          # Wait for infrastructure to be healthy
          echo "⏳ Waiting for infrastructure to be ready..."
          sleep 15

      - name: Infrastructure Readiness Test
        run: |
          set -euo pipefail
          cd /opt/MEVana
          echo "🧪 Testing infrastructure readiness before deploying MEVana services..."

          # Run deployment readiness test (infrastructure only)
          timeout 120s ./scripts/ci/deployment-readiness-test.sh || {
            echo "⚠️ Readiness test failed or timed out, but continuing with deployment"
            echo "📊 Infrastructure services status:"
            docker compose -f infrastructure/docker-compose.yml ps
          }

      - name: Deploy MEVana Services
        env:
          MEVANA_TAG: ${{ steps.vars.outputs.tag }}
          HOTPATH_IMAGE: ghcr.io/mike-inman/mevana-hotpath-arb-engine:${{ steps.vars.outputs.tag }}
          NORMALIZER_IMAGE: ghcr.io/mike-inman/mevana-normalizer-service:${{ steps.vars.outputs.tag }}
          DISCOVERY_IMAGE: ghcr.io/mike-inman/mevana-discovery-service:${{ steps.vars.outputs.tag }}
          EXECUTOR_IMAGE: ghcr.io/mike-inman/mevana-executor-service:${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          cd /opt/MEVana

          # Start MEVana application services
          echo "🚀 Starting MEVana application services..."
          docker compose -f infrastructure/docker-compose.yml up -d hotpath_arb_engine normalizer-service discovery-service executor-service

          # Wait for services to start
          echo "⏳ Waiting for MEVana services to initialize..."
          sleep 30

          # Show final status
          echo "📊 Final deployment status:"
          docker compose -f infrastructure/docker-compose.yml ps

      - name: Post-Deployment Comprehensive Validation
        run: |
          set -euo pipefail
          cd /opt/MEVana
          echo "🔍 Running comprehensive post-deployment diagnostics..."

          # Wait a bit more for all services to fully initialize
          echo "⏳ Allowing services additional startup time..."
          sleep 15

          # Run comprehensive diagnostics
          ./scripts/ci/post-deployment-diagnostics.sh || {
            echo "⚠️ Some post-deployment checks failed - review above"
            echo "📊 Service status for troubleshooting:"
            docker compose -f infrastructure/docker-compose.yml ps
            docker compose -f infrastructure/docker-compose.yml logs --tail=10 hotpath_arb_engine || true
            exit 1
          }

          echo "✅ Deployment validation completed successfully!"

      - name: Live Data Verification
        run: |
          set +e
          cd /opt/MEVana
          echo "🎯 Verifying live arbitrage detection..."

          # Check for live metrics
          echo "📊 Hotpath Engine Metrics:"
          curl -s --connect-timeout 5 http://localhost:8088/metrics | grep -E "(geyser_transactions|hotpath_multi_venue)" || echo "No live metrics yet"

          echo "📊 Normalizer Metrics:"
          curl -s --connect-timeout 5 http://localhost:9901/metrics | head -5 || echo "Normalizer metrics not ready"

          echo "📊 Grafana Dashboard:"
          curl -s -o /dev/null -w "Status: %{http_code}\n" --connect-timeout 5 http://localhost:3000/api/health || echo "Grafana not accessible"

          echo "🎉 Deployment completed! Check live dashboard at http://$(hostname -I | awk '{print $1}'):3000"

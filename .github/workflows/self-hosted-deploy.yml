name: Build and Deploy (Self-Hosted)
run-name: "Build and Deploy (Self-Hosted): services=${{ inputs.services || 'all' }}"

concurrency:
  group: self-hosted-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to deploy (hotpath normalizer discovery executor wallet-vault monitoring arb-engine api-service). Separate with spaces or commas; empty = core default"
        required: false
        default: "hotpath normalizer discovery executor wallet-vault monitoring api-service"
      skip_build:
        description: "Skip Docker build (use existing images for faster deployment)"
        required: false
        default: false
        type: boolean
      refresh_infra:
        description: "Recreate Docker infrastructure stack (Grafana, Kafka, etc.)"
        required: false
        default: false
        type: boolean
      infrastructure_only:
        description: "Deploy only infrastructure services (faster for config changes)"
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Docker network
        run: docker network create mevana_net 2>/dev/null || true

      - name: Sync infrastructure and compose files to /opt/MEVana
        run: |
          set -euo pipefail
          mkdir -p /opt/MEVana
          rsync -a --delete infrastructure/ /opt/MEVana/infrastructure/
          mkdir -p /opt/MEVana/scripts
          rsync -a --delete scripts/ /opt/MEVana/scripts/
          mkdir -p /opt/MEVana/database
          rsync -a --delete database/ /opt/MEVana/database/
          rm -f /opt/MEVana/docker-compose.mevana.yml

          # Sync systemd service files
          mkdir -p /opt/MEVana/infrastructure/systemd
          rsync -a --delete infrastructure/systemd/ /opt/MEVana/infrastructure/systemd/

      - name: Write infra env (optional)
        env:
          EP_A: ${{ secrets.HOTPATH_ENDPOINT }}
          EP_B: ${{ secrets.ENDPOINT }}
          XT_A: ${{ secrets.HOTPATH_X_TOKEN }}
          XT_B: ${{ secrets.X_TOKEN }}
        run: |
          EP="${EP_A:-${EP_B:-}}"
          XT="${XT_A:-${XT_B:-}}"
          if [ -n "$EP" ] && [ -n "$XT" ]; then
            mkdir -p /opt/MEVana /opt/MEVana/infrastructure
            printf "ENDPOINT=%s\nX_TOKEN=%s\n" "$EP" "$XT" | tee /opt/MEVana/infrastructure/.env > /opt/MEVana/.env
            echo "Wrote /opt/MEVana/.env and /opt/MEVana/infrastructure/.env"
          else
            echo "Skipping infra .env write (ENDPOINT/X_TOKEN secrets not set)"
          fi

      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          map_service(){
            case "$1" in
              hotpath|hotpath-arb-engine) echo hotpath-arb-engine ;;
              normalizer|normalizer-service) echo normalizer-service ;;
              discovery|discovery-service) echo discovery-service ;;
              executor|executor-service) echo executor-service ;;
              wallet|vault|wallet-vault) echo wallet-vault ;;
              monitoring|monitoring-service) echo monitoring-service ;;
              arb|arb-engine|arb_engine) echo arb-engine ;;
              price-aggregator|price_aggregator) echo price-aggregator ;;
              api|api-service|gateway) echo api-service ;;
              *) echo "$1" ;;
            esac
          }

          normalize_input(){
            printf '%s' "$1" | tr ',\n\r' '   ' | xargs
          }

          append_service(){
            local candidate="$1"
            [ -z "$candidate" ] && return
            if [[ " $services " != *" $candidate "* ]]; then
              services="$services $candidate"
            fi
          }

          raw_input="$(normalize_input "${{ inputs.services }}")"
          services=""
          build_required=false

          if [ -n "$raw_input" ]; then
            for raw in $raw_input; do
              mapped=$(map_service "$raw")
              append_service "$mapped"
            done
            build_required=true
          else
            changed_files=$(git diff --name-only HEAD^ HEAD 2>/dev/null || true)
            for file in $changed_files; do
              case "$file" in
                Cargo.lock|Cargo.toml|scripts/deployment/release-services.sh)
                  services="hotpath-arb-engine normalizer-service discovery-service executor-service wallet-vault monitoring-service price-aggregator api-service"
                  build_required=true
                  break
                  ;;
                crates/hotpath_arb_engine/*|crates/hotpath_arb_engine.rs|crates/hotpath_arb_engine/**)
                  append_service hotpath-arb-engine
                  ;;
                crates/normalizer-service/*|crates/normalizer-service.rs|crates/normalizer-service/**)
                  append_service normalizer-service
                  ;;
                crates/discovery-service/*|crates/discovery-service.rs|crates/discovery-service/**)
                  append_service discovery-service
                  ;;
                crates/executor-service/*|crates/executor-service.rs|crates/executor-service/**)
                  append_service executor-service
                  ;;
                crates/wallet-vault/*|crates/wallet-vault.rs|crates/wallet-vault/**)
                  append_service wallet-vault
                  ;;
                crates/monitoring-service/*|crates/monitoring-service.rs|crates/monitoring-service/**)
                  append_service monitoring-service
                  ;;
                crates/arb-engine/*|crates/arb-engine.rs|crates/arb-engine/**)
                  append_service arb-engine
                  ;;
                crates/price-aggregator/*|crates/price-aggregator.rs|crates/price-aggregator/**)
                  append_service price-aggregator
                  ;;
                crates/api-service/*|crates/api-service.rs|crates/api-service/**)
                  append_service api-service
                  ;;
                infrastructure/systemd/hotpath-arb-engine.service)
                  append_service hotpath-arb-engine
                  ;;
                infrastructure/systemd/normalizer-service.service)
                  append_service normalizer-service
                  ;;
                infrastructure/systemd/discovery-service.service)
                  append_service discovery-service
                  ;;
                infrastructure/systemd/executor-service.service)
                  append_service executor-service
                  ;;
                infrastructure/systemd/wallet-vault.service)
                  append_service wallet-vault
                  ;;
                infrastructure/systemd/monitoring-service.service)
                  append_service monitoring-service
                  ;;
                infrastructure/systemd/price-aggregator.service)
                  append_service price-aggregator
                  ;;
                infrastructure/systemd/arb-engine.service)
                  append_service arb-engine
                  ;;
                infrastructure/systemd/api-service.service)
                  append_service api-service
                  ;;
                crates/shared-core/*|crates/shared-core.rs|crates/shared-core/**)
                  services="hotpath-arb-engine normalizer-service discovery-service executor-service wallet-vault monitoring-service price-aggregator api-service"
                  build_required=true
                  break
                  ;;
              esac
            done

            if [ -n "$services" ]; then
              build_required=true
            fi
          fi

          if [ -z "$services" ]; then
            services="hotpath-arb-engine normalizer-service discovery-service executor-service wallet-vault monitoring-service price-aggregator api-service"
          fi

          services=$(printf '%s' "$services" | xargs)

          if [ "$build_required" = true ]; then
            echo "Detected services requiring build: $services"
          else
            echo "No code changes detected for services; using default service list for status checks"
          fi

          echo "services=${services}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "build_required=${build_required}" >> "$GITHUB_OUTPUT"

      - name: Determine build requirement
        id: build_scope
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.skip_build }}" = "true" ]; then
            echo "Build disabled via input"
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.vars.outputs.build_required }}" = "true" ]; then
            echo "Detected service changes requiring rebuild"
            echo "run_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No code changes detected; skipping rebuild"
            echo "run_build=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare systemd units
        shell: bash
        env:
          SERVICES: ${{ steps.vars.outputs.services }}
        run: |
          set -euo pipefail
          svcs=$(printf '%s' "${SERVICES}" | tr '\n' ' ' | xargs)
          if [ -z "$svcs" ]; then
            echo "No services provided" >&2
            exit 1
          fi

          echo "Services to prepare: [$svcs]"

          install_unit() {
            local svc_name="$1"
            local unit_file="$2"
            if [ -f "$unit_file" ]; then
              cp "$unit_file" /etc/systemd/system/
              echo "Installed $(basename "$unit_file")"
            else
              echo "Warning: $(basename "$unit_file") not found; skipping" >&2
            fi
          }

          for svc in $svcs; do
            case "$svc" in
              hotpath-arb-engine)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/hotpath-arb-engine.service
                ;;
              normalizer-service)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/normalizer-service.service
                ;;
              discovery-service)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/discovery-service.service
                ;;
              executor-service)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/executor-service.service
                ;;
              wallet-vault)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/wallet-vault.service
                ;;
              monitoring-service)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/monitoring-service.service
                ;;
              price-aggregator)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/price-aggregator.service
                ;;
              arb-engine)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/arb-engine.service
                ;;
              api-service)
                install_unit "$svc" /opt/MEVana/infrastructure/systemd/api-service.service
                ;;
              *)
                echo "Unknown service identifier '$svc'; skipping" >&2
                ;;
            esac
          done

          systemctl daemon-reload

      - name: Cache Cargo registry
        if: ${{ steps.build_scope.outputs.run_build == 'true' }}
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache Cargo build artifacts
        if: ${{ steps.build_scope.outputs.run_build == 'true' }}
        uses: actions/cache@v3
        with:
          path: |
            target
          key: ${{ runner.os }}-cargo-target-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-

      # Install dependencies, build, and deploy services in one step
      - name: Build and install updated binaries
        if: ${{ steps.build_scope.outputs.run_build == 'true' }}
        env:
          TAG: ${{ steps.vars.outputs.tag }}
          INSTALL_PREFIX: /opt/MEVana
        run: |
          set -euo pipefail

          # Set HOME if not set (GitHub Actions issue)
          export HOME=${HOME:-/root}

          echo "=== Installing system dependencies ==="
          # Install system dependencies needed for Rust builds
          apt-get update -qq
          apt-get install -y -qq build-essential pkg-config libssl-dev libpq-dev protobuf-compiler curl

          echo "=== Installing/updating Rust toolchain ==="
          # Check if rustup is already installed
          if ! command -v rustup >/dev/null 2>&1; then
            echo "Installing Rust toolchain..."
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          else
            echo "Rust toolchain already installed"
          fi

          # Always source cargo environment and add to PATH
          if [ -f "$HOME/.cargo/env" ]; then
            source "$HOME/.cargo/env"
          fi
          export PATH="$HOME/.cargo/bin:$PATH"

          # Set CARGO_CMD for the release script
          export CARGO_CMD="$HOME/.cargo/bin/cargo"

          echo "=== Verifying Rust installation ==="
          echo "Cargo path: $(which cargo)"
          cargo --version

          svcs="${{ steps.vars.outputs.services }}"
          svcs=$(printf '%s' "$svcs" | tr '\n' ' ' | xargs)
          echo "Services to build: [$svcs]"

          echo "=== Building and installing services ==="
          # Run from git repository root, not /opt/MEVana
          # Use release-services.sh to build and deploy bare-metal binaries
          if command -v sudo >/dev/null 2>&1 && [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          else
            SUDO=""
          fi

          if [ -z "$svcs" ]; then
            $SUDO ./scripts/deployment/release-services.sh
          else
            read -r -a svc_array <<< "$svcs"
            $SUDO ./scripts/deployment/release-services.sh "${svc_array[@]}"
          fi

          echo "=== Build and installation complete ==="

      - name: Restart services without rebuild
        if: ${{ steps.build_scope.outputs.run_build != 'true' && inputs.skip_build == true }}
        shell: bash
        env:
          SERVICES: ${{ steps.vars.outputs.services }}
        run: |
          set -euo pipefail
          svcs=$(printf '%s' "${SERVICES}" | tr '\n' ' ' | xargs)
          if [ -z "$svcs" ]; then
            echo "No services specified for restart" >&2
            exit 1
          fi

          map_to_unit() {
            case "$1" in
              hotpath-arb-engine) echo "hotpath-arb-engine.service" ;;
              normalizer-service) echo "normalizer-service.service" ;;
              discovery-service) echo "discovery-service.service" ;;
              executor-service) echo "executor-service.service" ;;
              wallet-vault) echo "wallet-vault.service" ;;
              monitoring-service) echo "monitoring-service.service" ;;
              price-aggregator) echo "price-aggregator.service" ;;
              arb-engine) echo "arb-engine.service" ;;
              api-service) echo "api-service.service" ;;
              *) echo "" ;;
            esac
          }

          units=()
          for svc in $svcs; do
            unit=$(map_to_unit "$svc")
            if [ -n "$unit" ]; then
              units+=("$unit")
            else
              echo "Skipping unknown service '$svc'" >&2
            fi
          done

          if [ ${#units[@]} -eq 0 ]; then
            echo "No valid systemd units resolved" >&2
            exit 1
          fi

          echo "Restarting units: ${units[*]}"
          systemctl enable "${units[@]}" || true
          systemctl restart "${units[@]}"

      - name: Clean Complete Deployment - Infrastructure
        if: ${{ inputs.refresh_infra == true }}
        env:
          MEVANA_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          cd /opt/MEVana

          # Make scripts executable
          chmod +x scripts/ci/*.sh

          # Persist the tag so Restart workflow can reuse it
          echo "${MEVANA_TAG}" > /opt/MEVana/.mevana_tag
          echo "Using MEVANA_TAG=${MEVANA_TAG} (persisted to /opt/MEVana/.mevana_tag)"

          # COMPLETE CLEAN SHUTDOWN - Remove ALL containers to avoid conflicts
          echo "🧹 Complete clean shutdown of all services..."
          docker compose -f infrastructure/docker-compose.yml down --remove-orphans || true
          docker compose -f infrastructure/docker-compose.core.yml down --remove-orphans || true
          docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml down --remove-orphans || true
          docker compose -p mevana -f infrastructure/docker-compose.server.yml down --remove-orphans || true

          # Remove any remaining conflicting containers
          docker stop mevana-hotpath mevana-hotpath-arb-engine-1 hotpath_arb_engine || true
          docker rm mevana-hotpath mevana-hotpath-arb-engine-1 hotpath_arb_engine || true

          # Free critical host ports in case stray containers are still bound
          for port in 9090 3000 8080 8082 29092 5433 6380 6379 2181; do
            ids=$(docker ps --filter "publish=${port}" --format '{{.ID}}')
            if [ -n "$ids" ]; then
              echo "Port ${port} still in use by container(s): $ids — stopping"
              echo "$ids" | while read -r cid; do
                [ -n "$cid" ] || continue
                docker stop "$cid" 2>/dev/null || true
                docker rm "$cid" 2>/dev/null || true
              done
            fi
          done

          # Start infrastructure services with correct configuration
          echo "🏗️ Starting infrastructure services (Prometheus, Grafana, Kafka, etc.)..."
          docker compose -p mevana -f infrastructure/docker-compose.server.yml up -d \
            zookeeper kafka redis postgres adminer prometheus grafana kafka-ui

          # Wait for infrastructure to be healthy
          echo "⏳ Waiting for infrastructure to be ready..."
          sleep 30

          # Verify infrastructure health
          echo "🔍 Verifying infrastructure health..."
          docker compose -p mevana -f infrastructure/docker-compose.server.yml ps

          # Bootstrap database schema and Kafka topics
          echo "🗄️ Bootstrapping database schema..."
          ./scripts/deployment/bootstrap_database.sh || {
            echo "❌ Database bootstrap failed"
            exit 1
          }

          echo "📡 Bootstrapping Kafka topics..."
          ./scripts/deployment/bootstrap_kafka.sh localhost:29092 || {
            echo "❌ Kafka bootstrap failed"
            exit 1
          }

          echo "✅ Database and Kafka bootstrap completed successfully"

      - name: Post-Deployment Comprehensive Validation
        run: |
          set -euo pipefail
          cd /opt/MEVana
          echo "🔍 Running comprehensive post-deployment diagnostics..."

          # Wait a bit more for all services to fully initialize
          echo "⏳ Allowing services additional startup time..."
          sleep 15

          # Run comprehensive diagnostics
          ./scripts/ci/post-deployment-diagnostics.sh || {
            echo "⚠️ Some post-deployment checks failed - review above"
            echo "📊 Service status for troubleshooting:"
            echo "Infrastructure services:"
            docker compose -p mevana -f infrastructure/docker-compose.server.yml ps
            echo "MEVana bare-metal services:"
            systemctl --no-pager status hotpath-arb-engine.service normalizer-service.service discovery-service.service executor-service.service wallet-vault.service monitoring-service.service || true
            echo "Recent logs from hotpath engine:"
            journalctl -u hotpath-arb-engine.service --lines=10 --no-pager || true
            exit 1
          }

          echo "✅ Deployment validation completed successfully!"

      - name: Live Data Verification
        run: |
          set +e
          cd /opt/MEVana
          echo "🎯 Verifying live arbitrage detection..."

          # Check for live metrics
          echo "📊 Hotpath Engine Metrics:"
          curl -s --connect-timeout 5 http://localhost:8088/metrics | grep -E "(geyser_transactions|hotpath_multi_venue)" || echo "No live metrics yet"

          echo "📊 Normalizer Metrics:"
          curl -s --connect-timeout 5 http://localhost:9901/metrics | head -5 || echo "Normalizer metrics not ready"

          echo "📊 Wallet Vault Status:"
          curl -s --connect-timeout 5 http://localhost:8090/wallets | head -5 || echo "Wallet vault not ready"

          echo "📊 Monitoring Service Metrics:"
          curl -s --connect-timeout 5 http://localhost:8091/metrics | head -5 || echo "Monitoring service metrics not ready"

          echo "📊 Grafana Dashboard:"
          curl -s -o /dev/null -w "Status: %{http_code}\n" --connect-timeout 5 http://localhost:3000/api/health || echo "Grafana not accessible"

          echo "🎉 Deployment completed! Check live dashboard at http://$(hostname -I | awk '{print $1}'):3000"

      - name: Create Deployment Notification Issue
        if: always()
        run: |
          cd /opt/MEVana
          echo "🐙 Creating deployment notification issue..."

          if command -v gh >/dev/null 2>&1 && gh repo view >/dev/null 2>&1; then
            # Generate deployment summary
            DEPLOYMENT_STATUS="${{ job.status }}"
            SERVER_IP=$(hostname -I | awk '{print $1}')

            if [ "$DEPLOYMENT_STATUS" = "success" ]; then
              TITLE="🎉 MEVana Deployment SUCCESSFUL - Live and Ready!"
              LABELS="deployment,deployment-success,live"
              BODY="MEVana deployment completed successfully! Server: $(hostname) at $SERVER_IP. Grafana: http://$SERVER_IP:3000 (admin/admin123). Prometheus: http://$SERVER_IP:9090. All services running and processing live arbitrage detection."
            else
              TITLE="❌ MEVana Deployment FAILED - Requires Investigation"
              LABELS="deployment,deployment-failed,urgent"
              BODY="MEVana deployment failed on $(hostname) at $SERVER_IP. Check GitHub Actions logs and service status. Run pre-deployment validation and fix issues before retrying."
            fi

            gh issue create \
              --title "$TITLE" \
              --body "$BODY" \
              --label "$LABELS" \
              --assignee "@me" || echo "Could not create GitHub issue"

            echo "📧 Deployment notification issue created!"
          else
            echo "GitHub CLI not available - skipping issue creation"
          fi

name: Self-Hosted Deploy

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Space-separated: hotpath normalizer discovery executor (empty = all app services)"
        required: false
        default: "hotpath"
      build_locally:
        description: "Build images locally on the server instead of pulling from GHCR"
        required: false
        default: "false"
      mevana_tag:
        description: "Override MEVANA_TAG (defaults to this commit SHA)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Docker network
        run: docker network create mevana_net 2>/dev/null || true

      - name: Write infra env (optional)
        if: ${{ secrets.HOTPATH_ENDPOINT != '' && secrets.HOTPATH_X_TOKEN != '' }}
        run: |
          mkdir -p infrastructure
          printf "ENDPOINT=%s\nX_TOKEN=%s\n" "${{ secrets.HOTPATH_ENDPOINT }}" "${{ secrets.HOTPATH_X_TOKEN }}" > infrastructure/.env

      - name: Resolve services and tag
        id: vars
        shell: bash
        run: |
          set -e
          # Map short names to compose service names
          map_service(){ case "$1" in hotpath) echo hotpath-arb-engine;; normalizer) echo normalizer-service;; discovery) echo discovery-service;; executor) echo executor-service;; *) echo "$1";; esac; }
          S="${{ github.event.inputs.services }}"; OUT=()
          if [ -n "$S" ]; then
            for sv in $S; do OUT+=("$(map_service "$sv")"); done
          else
            OUT=(hotpath-arb-engine normalizer-service discovery-service executor-service)
          fi
          echo "services=${OUT[*]}" >> "$GITHUB_OUTPUT"
          TAG="${{ github.event.inputs.mevana_tag }}"; if [ -z "$TAG" ]; then TAG="${GITHUB_SHA}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Docker login GHCR (pull mode)
        if: ${{ github.event.inputs.build_locally != 'true' && secrets.GHCR_USERNAME != '' && secrets.GHCR_TOKEN != '' }}
        run: echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin

      - name: Build locally (optional)
        if: ${{ github.event.inputs.build_locally == 'true' }}
        run: |
          # Build only the requested services; default Dockerfiles are in crates/* where applicable
          set -e
          svcs=( ${{ steps.vars.outputs.services }} )
          if [ ${#svcs[@]} -eq 0 ]; then svcs=(hotpath-arb-engine normalizer-service discovery-service executor-service); fi
          # Build with compose so build contexts resolve correctly
          docker compose -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml build ${svcs[*]}

      - name: Deploy (compose up)
        env:
          MEVANA_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          set -e
          svcs=( ${{ steps.vars.outputs.services }} )
          docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml up -d ${svcs[*]}
          docker compose -p mevana -f infrastructure/docker-compose.server.yml -f infrastructure/docker-compose.full.yml ps

      - name: Quick health checks
        run: |
          set +e
          echo "Grafana:"; curl -s -o /dev/null -w "%{http_code}\n" --connect-timeout 5 http://localhost:3000/api/health || true
          echo "Prometheus:"; curl -s -o /dev/null -w "%{http_code}\n" --connect-timeout 5 http://localhost:9090/-/healthy || true
          echo "Hotpath metrics head:"; curl -s --connect-timeout 5 http://localhost:8088/metrics | head -n 5 || true


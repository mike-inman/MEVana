[infrastructure]
docker_compose_path = "infrastructure/docker-compose.yml"
redis_url = "redis://localhost:6379"
kafka_bootstrap_servers = "localhost:9092"
postgres_url = "postgresql://mev:mevpassword@localhost:5433/mevdb"
check_infrastructure = true

startup_timeout = "300s"
health_check_interval = "30s"
max_restart_attempts = 3
restart_delay = "10s"

# We'll just test the infrastructure health check for now
# since we don't have all the services compiled yet
[[services]]
name = "infrastructure"
tier = "Infrastructure"
command = "echo"
args = ["Infrastructure services already running"]
critical = true
startup_delay = "5s"

[services.env]
RUST_LOG = "info"

[services.health_check]
endpoint = "http://localhost:9090/api/v1/query?query=up"
port = 9090
path = "/api/v1/query?query=up"
timeout = "10s"
retries = 5
# root Cargo.toml
[workspace]
resolver = "2"

members = [
  "crates/normalizer-runtime",
  "crates/normalizer-codegen",
  "crates/normalizer-generated",
  "crates/normalizer-service",
  "crates/edge-assembler",
  # "crates/geyser-streamer",
  "crates/whirlpool-core",
  "crates/shared-core",
  # "crates/arb-engine",  
]

# Only build these on plain `cargo build` / `cargo test`
default-members = [
  "crates/normalizer-generated",
  "crates/normalizer-service",
  "crates/edge-assembler",
]

# Put EXCLUDE **inside** [workspace]
exclude = [
  "crates/_archive/*",
  "crates/dex-stream-universal",
  "crates/raydium-clmm-stream",
  "crates/raydium-normalizer",
  "crates/raydium-quote-service",
  "crates/raydium-service",
  "crates/orca-service",
  "crates/meteora-service",
  "crates/jupiter-service",
  "crates/pump-service",
  #"crates/shared-core",
  "crates/mcp-idl-registry",
  "searcher-dev",
  "tools",
]

# Shared versions for crates using `{ workspace = true }`
[workspace.dependencies]
anyhow = "1.0"
bs58 = "0.5"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rdkafka = { version = "0.36", features = ["tokio"] }
redis = { version = "0.25", features = ["aio","tokio-comp"] }
tokio-postgres = "0.7"

prost = "0.13"
prost-build = "0.13"
tonic = "0.11"

walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
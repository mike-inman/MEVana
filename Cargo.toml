# root Cargo.toml
[workspace]
resolver = "2"

members = [
  # PRODUCTION HOTPATH SYSTEM
  "crates/hotpath_arb_engine",          # Zero-latency MEV detection
  "crates/executor-service",            # Trade execution engine
  
  # CORE SERVICES  
  "crates/arb-engine",                   # Arbitrage detection engine
  "crates/normalizer-service",           # Transaction parsing
  "crates/edge-assembler",               # Real-time transaction processing
  
  # SUPPORTING SERVICES
  "crates/monitoring-service",           # Performance monitoring and APIs
  "crates/kafka_db_writer",              # Kafka-to-database writer service
  "crates/dex-registry",                 # DEX metadata registry
  "crates/discovery-service",            # Service discovery
  "crates/token-registry-service",       # Token metadata
  
  # SHARED LIBRARIES
  "crates/shared-core",                  # Common utilities
  "crates/shared-protocol",              # Protocol definitions
  "crates/flash-loan-providers",         # Flash loan provider plugins
  "crates/flash-loan-receiver",          # Shared flash-loan receiver client
  "crates/whirlpool-core",              # Orca integration
  
  # CODE GENERATION
  "crates/normalizer-runtime",
  "crates/normalizer-codegen", 
  "crates/normalizer-generated",
  "crates/mevana-engine", "crates/wallet-vault", "crates/resilience-framework", "crates/api-service", "crates/system-orchestrator",
]

# Only build these on plain `cargo build` / `cargo test`
default-members = [
  # PRODUCTION HOTPATH SYSTEM - The main event! 🚀
  "crates/hotpath_arb_engine",
  "crates/executor-service",
  
  # CORE PIPELINE
  "crates/normalizer-generated",
  "crates/normalizer-service", 
  "crates/edge-assembler",
]

# Put EXCLUDE **inside** [workspace]
exclude = [
  "crates/_archive/*",
  "_archive/*",                        # All archived components
  "crates/whirlpool-state-streamer",
  "crates/shyft-pool-depth", 
  "crates/geyser-streamer",
  "crates/raydium-clmm-stream",
  "crates/raydium-normalizer",
  "crates/raydium-quote-service",
  "crates/raydium-service",
  "crates/orca-service",
  "crates/meteora-service",
  "crates/jupiter-service",
  "crates/pump-service",
  #"crates/shared-core",
  "crates/mcp-idl-registry",
  "searcher-dev",
  "tools",
]

# Shared versions for crates using `{ workspace = true }`
[workspace.dependencies]
anyhow = "1.0"
bs58 = "0.5"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
rdkafka = { version = "0.36", features = ["tokio"] }
redis = { version = "0.25", features = ["aio","tokio-comp"] }
tokio-postgres = "0.7"

prost = "0.13"
prost-build = "0.13"
tonic = "0.11"

walkdir = "2.5"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

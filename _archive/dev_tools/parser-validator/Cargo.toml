[package]
name = "parser-validator"
version = "0.1.0"
edition = "2024"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }

# HTTP clients
reqwest = { version = "0.11", features = ["json"] }

# Metrics
prometheus = "0.13"

# Web server
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4.0", features = ["derive", "env"] }

# Kafka
rdkafka = "0.36"
tokio-stream = "0.1"

# Solana transaction decoding
yellowstone-grpc-proto = "1.14.0"
prost = "0.12"
bs58 = "0.5"

# MEVana dependencies
shared-core = { path = "../shared-core" }
normalizer-service = { path = "../normalizer-service" }
normalizer-runtime = { path = "../normalizer-runtime" }
normalizer-generated = { path = "../normalizer-generated" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "latency_benchmarks"
harness = false

[lints]
workspace = true

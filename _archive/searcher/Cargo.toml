[package]
name = "searcher"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dashmap = "5.5"
uuid = { version = "1.0", features = ["v4", "serde"] }
bs58 = "0.5"
solana-sdk = "2.1.7"

# High-performance data structures
ahash = "0.8"
smallvec = "1.13"
rustc-hash = "1.1"

# Kafka for consuming EdgeDeltas
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Protobuf for EdgeDelta messages
prost = "0.13"
prost-types = "0.13"

# Internal dependencies
shared-core = { path = "../shared-core" }
whirlpool-core = { path = "../whirlpool-core" }

# Copy edge.proto from edge-assembler
[build-dependencies]
prost-build = "0.13"

[package]
name = "arb-test-mode"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
rdkafka = { version = "0.38", features = ["cmake-build"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
dotenv = "0.15"
redis = { version = "0.32", features = ["tokio-comp"] }
chrono = { version = "0.4", features = ["serde"] }

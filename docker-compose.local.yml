# Local development stack with mevana-* naming convention
# Uses existing infrastructure on mevana_net
# Built from local binaries instead of remote images

services:
  # Use local binaries for our custom services with mevana-* naming
  mevana-hotpath-arb-engine:
    image: alpine:latest
    container_name: mevana-hotpath-arb-engine
    external_links:
      - kafka
      - redis-service
      - postgres-service
    environment:
      - RUST_LOG=info
      - METRICS_PORT=8088
      - KAFKA_BROKER=kafka:9092
      - REDIS_URL=redis://redis-service:6379/0
      - DATABASE_URL=postgresql://mev:<POSTGRES_PASSWORD>@postgres-service:5432/mevdb
      - GEYSER_ENDPOINT=https://grpc.ny.shyft.to
      - X_TOKEN=<SHYFT_X_TOKEN>
      - PAPER_TRADING=true
    volumes:
      - ./target/release/hotpath_arb_engine:/usr/local/bin/hotpath_arb_engine:ro
    command: ["/usr/local/bin/hotpath_arb_engine"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8088/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "8088:8088"
    networks: [mevana_net]
    restart: unless-stopped

  mevana-normalizer-service:
    image: alpine:latest
    container_name: mevana-normalizer-service
    external_links:
      - kafka
      - postgres-service
    environment:
      - RUST_LOG=info
      - METRICS_PORT=8085
      - KAFKA_BROKER=kafka:9092
      - DATABASE_URL=postgresql://mev:<POSTGRES_PASSWORD>@postgres-service:5432/mevdb
    volumes:
      - ./target/release/normalizer-service:/usr/local/bin/normalizer-service:ro
    command: ["/usr/local/bin/normalizer-service"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8085/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "8085:8085"
    networks: [mevana_net]
    restart: unless-stopped

  mevana-discovery-service:
    image: alpine:latest
    container_name: mevana-discovery-service
    external_links:
      - kafka
    environment:
      - RUST_LOG=info
      - DISCOVERY_METRICS_PORT=9102
      - KAFKA_BROKER=kafka:9092
    volumes:
      - ./target/release/discovery-service:/usr/local/bin/discovery-service:ro
    command: ["/usr/local/bin/discovery-service"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9102/metrics"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    ports:
      - "9102:9102"
    networks: [mevana_net]
    restart: unless-stopped

networks:
  mevana_net:
    external: true
    name: mevana_net

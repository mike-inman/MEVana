[package]
name = "orca"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
dotenv = "0.15"
anyhow = "1.0.62"
backoff = { version = "0.4.0", features = ["tokio"] }
bs58 = "0.5.1"
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.11"
futures = "0.3"
futures-util = "0.3.24"
log = "0.4"
tonic = "0.12.1"
yellowstone-grpc-client = "4.2"
yellowstone-grpc-proto = "4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.11", features = ["json"] }

# Add missing Solana dependencies
solana-program = "2.1.21"
solana-sdk = "2.1.21"
solana-account-decoder-client-types = "2.1.21"
solana-transaction-status = "2.1.21"
spl-token = "6.0.0"

# Add missing utility dependencies
serde_with = "3.14"
# prost = "0.13"  # commented out until needed for protobuf encoding

# Local path dependencies
whirlpool_interface = { path = "parsers/whirlpool_interface" }
rdkafka = "0.38.0"

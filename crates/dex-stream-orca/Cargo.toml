[package]
name = "dex-stream-orca"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime and utilities
tokio = { version = "1.38", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
futures-util = "0.3.24"

# Configuration and environment
dotenv = "0.15"
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.11"

# Error handling and logging
anyhow = "1.0.62"
backoff = { version = "0.4.0", features = ["tokio"] }
log = "0.4"

# Serialization and data handling
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.14"
chrono = { version = "0.4", features = ["serde"] }

# HTTP and networking
reqwest = { version = "0.11", features = ["json"] }
tonic = { version = "0.12", features = ["tls"] }

# Solana ecosystem
solana-program = { workspace = true }
solana-sdk = { workspace = true }
solana-transaction-status = { workspace = true }
solana-account-decoder = "2.1.21"
solana-account-decoder-client-types = "2.1.21"
spl-token = "6.0.0"

# gRPC and streaming
yellowstone-grpc-client = "4.2.1"
yellowstone-grpc-proto = "4.2.1"

# Blockchain utilities
bs58 = "0.5.1"

# Message streaming
rdkafka = "0.38.0"

# Local path dependencies
whirlpool_interface = { path = "parsers/whirlpool_interface" }

[package]
name = "normalizer-service"
version = "0.1.0"
edition = "2021"

[build-dependencies]
normalizer-codegen = { path = "../normalizer-codegen" }
mevana-idl-registry = { path = "../mevana-idl-registry" }

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }   # for BroadcastStream
lazy_static = { workspace = true }     
normalizer-runtime = { path = "../normalizer-runtime" }
normalizer-generated = { path = "../normalizer-generated" }
once_cell = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4.5", features = ["derive","env"] }
base64 = "0.22"

# NEW (needed for Capture + decode + logging)
rdkafka = { version = "0.38", features=["cmake-build"] }
yellowstone-grpc-proto = "4.2.1"
chrono = { version = "0.4", features = ["serde"] }
dotenv = "0.15"
env_logger = "0.11"
bs58 = "0.5"
log="0.4"
tokio={version = "1",features=["full"]}
redis = { version = "0.32", features = ["tokio-comp"] }
lru = "0.12"

# NEW: HTTP server for health endpoints
# axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }
prometheus = "0.13"
warp = "0.3"
normalizer-codegen = { path = "../normalizer-codegen" }
futures-util = "0.3.31"
# tokio-stream = "0.1.17"

[features]
default = []
experimental-hooks = []

[[bin]]
name = "list"
path = "src/bin/list.rs"

[[bin]]
name = "tap_orca_decode"
path = "src/bin/tap_orca_decode.rs"

[[bin]]
name = "tap_orca_extract"
path = "src/bin/tap_orca_extract.rs"

# Keep only while debugging:
# [[bin]]
# name = "tap_orca_debug"
# path = "src/bin/tap_orca_debug.rs"

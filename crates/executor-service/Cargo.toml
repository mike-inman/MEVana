[package]
name = "executor-service"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "account-registry-validate"
path = "src/bin/account_registry_validate.rs"

[[bin]]
name = "test-execution-orchestrator"
path = "src/bin/test_execution_orchestrator.rs"

[[bin]]
name = "wallet-setup"
path = "src/bin/wallet_setup.rs"

[features]
strict-accounts = []
admin-mtls = []

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
async-trait = "0.1"
dotenvy = "0.15"
clap = { version = "4.5", features = ["derive"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# HTTP client for Shyft.to APIs
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }

# Kafka integration
rdkafka = { version = "0.36", features = ["cmake-build"] }
tokio-tungstenite = { version = "0.21", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
base64 = "0.22"
url = "2.5"
fastrand = "2"
shared-protocol = { path = "../shared-protocol" }

# High-performance collections
dashmap = "5.5"
ahash = "0.8"
flash-loan-providers = { path = "../flash-loan-providers" }

# Cryptography and encoding
bs58 = "0.5"
hex = "0.4"
sha2 = "0.10"
bincode = "1.3"

# Configuration
config = "0.14"
shellexpand = "3.1"

# Metrics and monitoring
prometheus = "0.13"
warp = { version = "0.3", features = ["default"] }
hyper = { version = "0.14", features = ["http1","server","backports"] }
tokio-stream = { version = "0.1", features = ["net"] }
yellowstone-grpc-client = { version = "4.2.1" }
yellowstone-grpc-proto = "4.2.1"
tonic = { version = "0.12", features = ["transport"] }
parking_lot = "0.12"
tokio-rustls = "0.25"
rustls = { version = "0.22", default-features = false, features = ["ring", "logging"] }
rustls-pemfile = "2.1"
once_cell = "1.19"
x509-parser = "0.16"
chrono = { version = "0.4", features = ["serde"] }
governor = "0.6"
solana-sdk = "=2.1.21"
solana-transaction-status = "=2.1.21"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json", "migrate"] }
borsh = "1"
whirlpool-core = { path = "../whirlpool-core" }
# For building EdgeDelta and feeding detector
arb-engine = { path = "../arb-engine" }
edge_assembler = { package = "edge-assembler", path = "../edge-assembler" }
# Raydium CLMM interface (archived). For now we inline minimal struct; keep placeholder feature flag.

[dev-dependencies]
rcgen = "0.13"
libc = "0.2"
tempfile = "3.10"

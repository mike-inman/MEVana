# Parser Validation Framework Configuration
# Date: 2025-01-20

[api_keys]
# Ground truth data sources
# Set these via environment variables or update with your API keys
shyft_api_key = "${SHYFT_API_KEY}"
helius_api_key = "${HELIUS_API_KEY}" 
solscan_api_key = "${SOLSCAN_API_KEY}"

[endpoints]
# API endpoints for ground truth sources
shyft_rpc_url = "https://rpc.shyft.to"
shyft_api_url = "https://api.shyft.to"
helius_rpc_url = "https://rpc.helius.xyz"
helius_api_url = "https://api.helius.xyz"
solscan_api_url = "https://public-api.solscan.io"

[database]
# PostgreSQL database for validation results (uses existing docker-compose setup)
url = "postgresql://postgres:password@localhost:5432/mevana_validation"
max_connections = 20
connection_timeout_seconds = 30

[validation]
# Validation session configuration
duration_hours = 1
accuracy_threshold = 0.99
completeness_threshold = 0.95
latency_threshold_ms = 10

# Target DEXs to validate (program IDs)
target_dexes = [
    "whirLbMiicVdio4qvUfM5KAg6Ct8VwpYzGff3uctyCc",  # Orca Whirlpools
    "PhoeNiXZ8ByJGLkxNfZRnkUfjvmuYqLR89jjFHGqdXY",  # Phoenix CLOB
    "6EF8rrecthR5Dkzon8Nwu78hRvfCKubJ14M5uBEwF6P",  # Pump.fun
    "675kPX9MHTjS2zt1qfr1NYHuzeLXfQM9H24wFSUt1Mp8", # Raydium AMM
    "5Q544fKrFoe6tsEbD7S8EmxGTJYAKtTVhAW5Q5pge4j1", # Raydium CLMM
    "cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG", # Meteora DAMM
    "opnb2LAfJYbRMAHHvqjCwQxanZn7ReEHp1k81EohpZb", # OpenBook v2
    "GFXsSL5sSaDfNFQUYsHekbWBW1TsFdjDYzACh62tEHxn", # GooseFX
]

[tolerance]
# Accuracy tolerances
price_tolerance_bps = 1        # 0.01% price deviation tolerance
amount_tolerance_bps = 1       # 0.01% amount deviation tolerance
address_exact_match = true
case_sensitive_symbols = false

# Performance tolerances
max_parse_time_us = 10000      # 10ms maximum parse time
max_validation_time_us = 50000 # 50ms maximum validation time

# Timestamp tolerances
timestamp_tolerance_ms = 1000  # 1 second block time variation

# Error thresholds
max_error_rate = 0.01          # 1% maximum error rate
max_warning_rate = 0.05        # 5% maximum warning rate

# Confidence requirements
min_ground_truth_confidence = 0.8  # 80% minimum ground truth consensus
min_parser_confidence = 0.8        # 80% minimum parser confidence

[load_testing]
# Load testing configuration
test_levels_tps = [10, 50, 100, 500, 1000, 2000]
test_duration_seconds = 60
ramp_up_seconds = 10
cool_down_seconds = 5

[dashboard]
# Web dashboard configuration
host = "0.0.0.0"
port = 8085
enable_cors = true
static_dir = "static"

[metrics]
# Prometheus metrics configuration
enable_prometheus = true
metrics_port = 9090
metrics_path = "/metrics"
update_interval_seconds = 30

[logging]
# Logging configuration
level = "info"
format = "json"
file = "validation.log"
max_file_size_mb = 100
max_files = 10

[sampling]
# Data sampling configuration for large datasets
enable_sampling = false
sample_rate = 0.1              # 10% sampling rate
min_samples_per_dex = 100      # Minimum samples per DEX
max_samples_per_hour = 10000   # Maximum samples per hour

[alerting]
# Alerting thresholds
enable_alerts = true
accuracy_alert_threshold = 0.95    # Alert if accuracy drops below 95%
error_rate_alert_threshold = 0.05  # Alert if error rate exceeds 5%
latency_alert_threshold_ms = 50    # Alert if latency exceeds 50ms

# Alert channels (configure webhooks/emails separately)
slack_webhook_url = "${SLACK_WEBHOOK_URL}"
discord_webhook_url = "${DISCORD_WEBHOOK_URL}"
email_recipients = ["${ALERT_EMAIL}"]

[ground_truth]
# Ground truth source configuration
consensus_threshold = 0.8          # 80% consensus required
max_source_timeout_seconds = 10    # Timeout for API calls
retry_attempts = 3                 # Retry failed API calls
backoff_multiplier = 2             # Exponential backoff multiplier

# Source priorities (1 = highest priority)
source_priorities = { shyft = 1, helius = 2, solscan = 3 }

# Rate limiting
requests_per_second = 10
burst_capacity = 50

[caching]
# Caching configuration for ground truth data
enable_caching = true
cache_ttl_seconds = 300        # 5 minutes
max_cache_size_mb = 100
cache_compression = true

[development]
# Development/testing specific settings
mock_ground_truth = false      # Use mock data for testing
debug_mode = false            # Enable verbose debugging
save_raw_data = false         # Save raw API responses
test_mode = false             # Skip actual API calls

[profiles]
# Predefined configuration profiles

[profiles.production]
accuracy_threshold = 0.999
completeness_threshold = 0.98
latency_threshold_ms = 5
max_error_rate = 0.001
enable_sampling = false
logging.level = "warn"

[profiles.development]
accuracy_threshold = 0.90
completeness_threshold = 0.85
latency_threshold_ms = 100
max_error_rate = 0.1
enable_sampling = true
sample_rate = 0.05
logging.level = "debug"
debug_mode = true

[profiles.load_testing]
test_levels_tps = [100, 500, 1000, 2000, 5000]
test_duration_seconds = 300
enable_sampling = true
sample_rate = 0.01
max_samples_per_hour = 50000

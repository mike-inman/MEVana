

services:
  # Development environment (default)
  dex_stream_universal_v2_dev:
    build:
      context: ../..
      dockerfile: crates/dex-stream-universal-v2/Dockerfile
    profiles: ["dev"]
    container_name: dex_stream_universal_v2_dev
    environment:
      - RUST_LOG=info
      - KAFKA_BROKER=kafka:9092
      - TOPIC=dex-transactions
      - ENDPOINT=https://grpc.ny.shyft.to
      - X_TOKEN=${X_TOKEN:-efff2d23-97ae-4c5f-8b8b-9a6265001189}
      - HEALTH_PORT=8084
      - BIND_ADDRESS=0.0.0.0
      - DEX_FILTERING=OFF
    ports:
      - "8084:8084"
    networks:
      - mevana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Test environment
  dex_stream_universal_v2_test:
    build:
      context: ../..
      dockerfile: crates/dex-stream-universal-v2/Dockerfile
    profiles: ["test"]
    container_name: dex_stream_universal_v2_test
    environment:
      - RUST_LOG=info
      - KAFKA_BROKER=kafka:9092
      - TOPIC=dex-transactions
      - ENDPOINT=https://grpc.ny.shyft.to
      - X_TOKEN=${TEST_X_TOKEN:-efff2d23-97ae-4c5f-8b8b-9a6265001189}
      - HEALTH_PORT=8084
      - BIND_ADDRESS=0.0.0.0
      - DEX_FILTERING=OFF
    ports:
      - "8084:8084"
    networks:
      - mevana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Production environment
  dex_stream_universal_v2_prod:
    build:
      context: ../..
      dockerfile: crates/dex-stream-universal-v2/Dockerfile
    profiles: ["prod"]
    container_name: dex_stream_universal_v2_prod
    environment:
      - RUST_LOG=warn
      - KAFKA_BROKER=kafka:9092
      - TOPIC=dex-transactions
      - ENDPOINT=https://grpc.ny.shyft.to
      - X_TOKEN=${PROD_X_TOKEN:-efff2d23-97ae-4c5f-8b8b-9a6265001189}
      - HEALTH_PORT=8084
      - BIND_ADDRESS=0.0.0.0
      - DEX_FILTERING=ON
    ports:
      - "8084:8084"
    networks:
      - mevana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://:8084/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  mevana-network:
    external: true



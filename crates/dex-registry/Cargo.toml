[package]
name = "dex-registry"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# High-performance collections
dashmap = "5.5"
ahash = "0.8"
once_cell = "1.19"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Kafka integration
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }

# Configuration
config = "0.14"
shellexpand = "3.1"

# Cryptography and encoding
bs58 = "0.5"
hex = "0.4"

# Plugin system
libloading = "0.8"
abi_stable = "0.11"

# IDL processing
# anchor-lang = "0.30"  # Temporarily disabled due to version conflicts

# Metrics
prometheus = "0.13"
warp = "0.3"
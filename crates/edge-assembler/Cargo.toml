[package]
name = "edge-assembler"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
bs58 = "0.5"
uuid = { version = "1.0", features = ["v4"] }
dashmap = "5.5"
solana-sdk = "2.1.7"

# Kafka
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Internal dependencies
shared-core = { path = "../shared-core" }
whirlpool-core = { path = "../whirlpool-core" }

# For protobuf edge deltas
prost = "0.13"
prost-types = "0.13"

[build-dependencies]
prost-build = "0.13"

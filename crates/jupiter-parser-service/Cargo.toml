[package]
name = "jupiter-parser-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Kafka
rdkafka = "0.36"

# Solana transaction decoding
yellowstone-grpc-proto = "1.14.0"
prost = "0.12"
bs58 = "0.5"

# HTTP server for health/metrics
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.0", features = ["derive", "env"] }

# Environment
dotenv = "0.15"
chrono = "0.4"

# Metrics
prometheus = "0.13"

# Database  
redis = { version = "0.24", features = ["tokio-comp"] }

# MEVana dependencies
normalizer-generated = { path = "../normalizer-generated" }
normalizer-runtime = { path = "../normalizer-runtime" }

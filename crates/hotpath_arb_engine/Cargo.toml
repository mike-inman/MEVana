[package]
name = "hotpath_arb_engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
lazy_static = { workspace = true }

# Geyser/gRPC dependencies - match existing dex-stream-integrated versions
yellowstone-grpc-client = "4.2.1"
yellowstone-grpc-proto = "4.2.1"
tonic = { version = "0.12", features = ["tls"] }
prost = "0.12"
rustls = { version = "0.23", features = ["ring"] }
bs58 = { workspace = true }

# Metrics and HTTP API
metrics = "0.23"
metrics-exporter-prometheus = "0.15"
prometheus = "0.13"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

# Async utilities
futures = "0.3"
tokio-stream = "0.1"
crossbeam = "0.8"
dashmap = "5.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }
dotenv = "0.15"
rand = "0.8"
bincode = "1.3"
# Redis for metrics publishing to monitoring service
redis = { version = "0.24", features = ["tokio-comp"] }

# HTTP client for API calls
reqwest = { version = "0.11", features = ["json"] }

# Kafka for publishing arbitrage opportunities to shared mempool  
rdkafka = { version = "0.38", features = ["tokio", "ssl-vendored"] }

# HOT PATH ARBITRAGE - Direct integration for zero-latency MEV detection
arb-engine = { path = "../arb-engine" }
edge-assembler = { path = "../edge-assembler" }
normalizer-runtime = { path = "../normalizer-runtime" }
shared-core = { path = "../shared-core" }
shared-protocol = { path = "../shared-protocol" }
whirlpool-core = { path = "../whirlpool-core" }

# LETHAL EXECUTION SYSTEM - Direct executor integration for instant trade execution
executor-service = { path = "../executor-service" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "macros"] }

# Transaction execution dependencies
solana-sdk = "2.1.21"
solana-client = "2.1.21"
solana-transaction-status = "2.1.21"
borsh = "1"
fastrand = "2.0"
once_cell = "1.21.3"

# Flash loan protocol integrations - using existing Solana SDK

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }

[[bin]]
name = "hotpath_arb_engine"
path = "src/main.rs"

[lib]
name = "hotpath_arb_engine"
path = "src/lib.rs"

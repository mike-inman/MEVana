# Prometheus configuration for MEVana Docker deployment
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Rule files
rule_files: []

# Scrape targets
scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'hotpath-engine'
    static_configs:
      - targets: ['host.docker.internal:8088']
    scrape_interval: 5s
    scrape_timeout: 5s
    metrics_path: /metrics

[package]
name = "shared-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["sync", "time"] }
anyhow = "1.0"
solana-sdk = "2.1"
log = "0.4"
lazy_static = "1.4"
chrono = { version = "0.4", features = ["serde"] }
toml = "0.8"

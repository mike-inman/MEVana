[package]
name = "whirlpool-quote-surface"
version = "0.1.0"
edition = "2021"

# Local workspace to allow isolated builds without pulling root workspace deps
# [workspace]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4.0", features = ["derive", "env"] }
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
redis = { version = "0.24", features = ["tokio-comp"] }
rdkafka = "0.36"

# Local math/utilities
whirlpool-core = { path = "../whirlpool-core" }
bs58 = "0.5"
solana-client = "2.1.16"
solana-sdk = "2.1.16"
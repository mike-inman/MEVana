[package]
name = "gap-survey"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
geyser-capture = { path = "../geyser-capture" }
whirlpool-core = { path = "../whirlpool-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
yellowstone-grpc-proto = "=4.2.1"
tokio = { version = "1", features = ["full"] }
prost = "0.13.5"
num-bigint = "0.4"
num-traits = "0.2"
bs58 = "0.5"
base64 = "0.22"
sha2 = "0.10"
chrono = { version = "0.4.41", features = ["serde"] }
reqwest = { version = "0.11.27", default-features = false, features = ["json", "rustls-tls"] }
tonic = { version = "0.12.3", features = ["transport", "tls", "tls-native-roots"] }

[dev-dependencies]
tempfile = "3.21.0"

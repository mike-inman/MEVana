[package]
name = "dex-stream-integrated"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dex-stream-integrated"
path = "src/main.rs"

[dependencies]
# Core dependencies from dex-stream-universal
anyhow = "1"
dotenv = "0.15"
env_logger = "0.11"
log = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
backoff = { version = "0.4", features = ["tokio"] }
tokio = { version = "1.38", features = ["full"] }
yellowstone-grpc-client = "4.2.1"
yellowstone-grpc-proto = "4.2.1"
bs58 = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tonic = "0.12"
futures-util = "0.3"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.11", features = ["json"] }
shared-core = { path = "../shared-core" }

# HTTP server for health endpoints
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Metrics and monitoring
prometheus = { version = "0.13", features = ["process"] }
lazy_static = "1.4"
hyper = { version = "1.6.0", features = ["full"] }

# PostgreSQL for raw transaction logging (async)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
uuid = { version = "1.0", features = ["v4"] }

# Ultra-low latency dependencies
crossbeam = "0.8"
dashmap = "5.5"
parking_lot = "0.12"
smallvec = "1.15"

# Arbitrage engine dependencies
solana-sdk = "=2.1.21"
solana-transaction-status = "=2.1.21"
solana-program = "=2.1.21"
solana-account-decoder-client-types = "=2.1.21"
spl-token = "7.0.0"
solana-client = "2.1.13"
sha2 = "0.10.9"
borsh = "1.5"

# Whirlpool dependencies
whirlpool_interface = { path = "../whirlpool-state-streamer/parsers/whirlpool_interface", features = ["serde"] }

# Edge assembler dependencies
whirlpool-core = { path = "../whirlpool-core" }
prost = "0.12"

# Kafka for async persistence (non-blocking)
rdkafka = "0.38"

# Redis for async caching
redis = { version = "0.32", features = ["tokio-comp"] }

# Random number generation for testing
rand = "0.8"

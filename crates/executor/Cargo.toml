[package]
name = "executor"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
bs58 = "0.5"

# Minimal dependencies to avoid conflicts for now
# solana-client = "1.18"
# solana-sdk = "1.18"
# solana-transaction-status = "1.18"
# anchor-lang = "0.29"

# Kafka for consuming opportunities
rdkafka = { version = "0.36", features = ["cmake-build"] }

# HTTP client for Jito
reqwest = { version = "0.12", features = ["json"] }
shellexpand = "3.1"

# High-performance collections
dashmap = "5.5"
ahash = "0.8"

# Internal dependencies
shared-core = { path = "../shared-core" }
whirlpool-core = { path = "../whirlpool-core" }

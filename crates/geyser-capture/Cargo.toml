[package]
name = "geyser-capture"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "4.5.47", features = ["derive"] }
prost = "0.13.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
shared-core = { path = "../shared-core" }
whirlpool-core = { path = "../whirlpool-core" }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1.17"
tonic = { version = "0.12.3", features = ["transport", "tls", "tls-native-roots"] }
yellowstone-grpc-proto = "=4.2.1"
bs58 = "0.5"
url = "2"
rand = "0.8.5"
zstd = "0.13"
solana-sdk = "2.1.7"

[dev-dependencies]
tempfile = "3.21.0"
borsh = "1.5"
toml = "0.8.23"

[package]
name = "pump_fun_grpc_txn_stream_n_parse"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive", "env"] }
dotenv = "0.15"
env_logger = "0.10"
futures-util = "0.3"
log = "0.4"

#redis = { version = "0.23", features = ["tokio-comp", "connection-manager"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }

tokio = { version = "1.0", features = ["full"] }
yellowstone-grpc-client = "4.0.0"
yellowstone-grpc-proto = { version = "4.0.0", default-features = false, features = ["plugin"] }
whirlpool_interface = { path = "./parsers/whirlpool_interface" }
bincode = "1.3"
backoff = "0.4"
bs58 = "0.5"
chrono = "0.4"
tonic = "0.12.1"

reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

lru = "0.12"
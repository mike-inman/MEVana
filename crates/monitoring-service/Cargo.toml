[package]
name = "monitoring-service"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }

# Web framework and CORS
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "fs"] }
tower = "0.5"

# OpenAPI/Swagger support
utoipa = { version = "4", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "7", features = ["axum"] }

# Redis for metrics sharing
redis = { version = "0.24", features = ["tokio-comp"] }

# Database (optional for historical data)
sqlx = { version = "0.8", optional = true, default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "json"] }

# Time utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["serde", "v4"] }

# Metrics
metrics = "0.22"
metrics-exporter-prometheus = "0.15"

# Async utilities
futures = "0.3"
dashmap = "5.5"

# HotPath integration for discard pile consumption
hotpath_arb_engine = { path = "../hotpath_arb_engine" }

[features]
default = ["database"]
database = ["sqlx"]

[[bin]]
name = "monitoring-service"
path = "src/main.rs"
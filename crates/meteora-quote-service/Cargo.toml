[package]
name = "meteora-quote-service"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
anyhow = "1.0"
backoff = { version = "0.4", features = ["tokio"] }
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"
solana-client = "2.1.7"
solana-sdk = "2.1.7"
solana-transaction-status = "2.1.7"
solana-account-decoder-client-types = "2.1.7"
solana-program = "2.1.7"
tokio = { version = "1.36", features = ["rt-multi-thread", "macros", "time"] }
redis = { version = "0.24", features = ["tokio-comp"] }
rdkafka = { version = "0.36", features = ["tokio"] }
bs58 = "0.5"
base64 = "0.22"
futures = { version = "0.3", features = ["std"] }
yellowstone-grpc-client = "4.0.0"
yellowstone-grpc-proto = { version = "4.0.0", default-features = false, features = ["plugin"] }
tonic = { version = "0.12", features = ["tls-native-roots"] }
spl-token = "7.0"
meteora_damm_interface = { path = "parsers/meteora_damm_interface", features = ["serde"] }

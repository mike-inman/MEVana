[package]
name = "arb-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
arc-swap = "1"
bytes = "1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-queue = "0.3"
smallvec = "1"

# Optional: switch to simd-json for ingest if you still have JSON at the boundary
# simd-json = { version = "0.13", optional = true, features = ["runtime-dispatch-simd"] }

# Reuse your shared types
normalizer-runtime = { path = "../normalizer-runtime" }

# ---- Solana v3 split crates ----
solana-sdk = "3"
solana-instruction = "3"
solana-transaction = "3"
solana-message = "3"
solana-compute-budget-interface = "3"



# jito-block-engine = "..."  # add your preferred client here when ready
redis = { version = "0.25", features = ["tokio-comp"] }

# Optional: wire Kafka right here, or keep it in normalizer-service
rdkafka = { version = "0.38", features = ["tokio"] }
once_cell = "1.21.3"
solana-program = "3.0.0"
whirlpool-core = { version = "0.1.0", path = "../whirlpool-core" }
bs58 = "0.5"
# prost = "0.12" # Temporarily removed - not using protobuf decoding yet
edge-assembler = { path = "../edge-assembler" } # Re-enabled now that dependencies are fixed

[features]
# Default features (always enabled)
default = ["std"]

# Core functionality
std = []

# Development features - enable for development builds
development = ["stubs"]

# Stub implementations - for development/testing
stubs = []

# Production mode - optimized for production use
production = []

# DEX support (can be enabled individually or together)
whirlpool = []
raydium = []
meteora = []

# Full feature set
full = ["whirlpool", "raydium", "meteora"]

# Experimental features
experimental = []

# Convenience features for common use cases
dev-full = ["development", "full"]  # Development with all DEXes
prod-basic = ["production", "whirlpool"]  # Production with basic Whirlpool support

[[bin]]
name = "arb-engine"
path = "src/main.rs"

[[bin]]
name = "test_edge_integration"
path = "src/bin/test_edge_integration.rs"

# [[bin]]
# name = "arb_hot"
# path = "src/bin/arb_hot.rs"

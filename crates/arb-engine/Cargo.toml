[package]
name = "arb-engine"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
async-trait = "0.1"
arc-swap = "1"
bytes = "1"
dashmap = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-queue = "0.3"
smallvec = "1"

# Optional: switch to simd-json for ingest if you still have JSON at the boundary
# simd-json = { version = "0.13", optional = true, features = ["runtime-dispatch-simd"] }

# Reuse your shared types
normalizer-runtime = { path = "../normalizer-runtime" }

# Solana/Jito (pin to your toolchain versions)
solana-sdk = "3.0.0" # align with your cluster/tooling
solana-compute-budget-interface = "3"
solana-instruction = "3"




# jito-block-engine = "..."  # add your preferred client here when ready
redis = { version = "0.25", features = ["tokio-comp"] }

# Optional: wire Kafka right here, or keep it in normalizer-service
rdkafka = { version = "0.38", features = ["tokio"] }
once_cell = "1.21.3"
solana-program = "3.0.0"

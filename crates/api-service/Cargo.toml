[package]
name = "api-service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core dependencies
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
log = { workspace = true }
env_logger = { workspace = true }

# Web framework
axum = { version = "0.7", features = ["json", "query", "ws", "tokio"] }
tower = { version = "0.4", features = ["util", "make"] }
tower-http = { version = "0.5", features = ["cors", "trace", "compression-full", "auth"] }

# OpenAPI documentation
utoipa = { version = "4.1", features = ["axum_extras", "chrono", "uuid"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "json", "uuid", "chrono"] }
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Async utilities
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Authentication and security
jsonwebtoken = "9.2"
bcrypt = "0.15"

# Caching
moka = { version = "0.12", features = ["future"] }
redis = { workspace = true }

# Metrics
prometheus = "0.13"
once_cell = "1.19"
tracing = { version = "0.1", features = ["std"] }

# Error handling
thiserror = "1.0"

# Resilience framework
resilience-framework = { path = "../resilience-framework" }

# Shared utilities (centralized database config)
shared-core = { path = "../shared-core" }

# Kafka for consuming arbitrage opportunities from hotpath engine
rdkafka = { version = "0.38", features = ["tokio", "ssl-vendored"] }

    kind: "CLOB"
    pool_account_roles: ["market"]
    user_authority_roles: ["signer"]
    token_accounts_roles_in: ["userBaseAccount", "userQuoteAccount"]
    token_accounts_roles_out: ["userBaseAccount", "userQuoteAccount"]

[package]
name = "wallet-metrics-exporter"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wallet-metrics-exporter"
path = "src/main.rs"

[dependencies]
# Core async runtime
tokio = { version = "1.0", features = ["full"] }
anyhow = "1.0"
log = "0.4"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client for price APIs
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }

# Metrics and monitoring
prometheus = "0.13"
warp = "0.3"

# Shyft client for wallet balances
executor-service = { path = "../executor-service" }

# Utilities
chrono = "0.4"
once_cell = "1.19"

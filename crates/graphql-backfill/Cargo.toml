[dependencies]
anyhow = "1"
bs58 = "0.5"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
dotenv = "0.15"
env_logger = "0.11"
lru = "0.12"                # ← LRU cache
log = "0.4"
redis = { version = "0.32", features = ["tokio-comp"] }
reqwest = { version = "0.12", features = ["json", "gzip", "brotli", "deflate", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

lru = "0.12"
